# Telegraf for the ESXi / vCenter dashboard: vCenter's performance metrics, served for Prometheus
# (job `vsphere`). The vCenter URL and a read-only account come from secrets/vsphere.env; vCenter's
# CA certificate from secrets/vsphere-ca.pem (vCenter publishes it in https://<vcenter>/certs/download.zip).
# Two collectors, as Telegraf's vSphere docs recommend: hosts and VMs from vCenter's 20-second
# realtime counters, datastores from its 30-minute history.

[agent]
  interval = "60s"
  flush_interval = "60s"
  omit_hostname = true
  skip_processors_after_aggregators = true

# Hosts and VMs. Per-core and per-NIC instances are kept: counting a VM's CPU instances gives its
# vCPUs, a host's its logical CPUs (for the overcommit ratio).
[[inputs.vsphere]]
  vcenters = ["${VSPHERE_URL}"]
  username = "${VSPHERE_USERNAME}"
  password = "${VSPHERE_PASSWORD}"
  tls_ca = "/etc/telegraf/vsphere-ca.pem"
  vm_metric_include = [
    "cpu.usage.average", "cpu.ready.summation",
    "mem.usage.average", "mem.consumed.average", "mem.granted.average", "mem.active.average",
    "net.usage.average", "disk.usage.average", "sys.uptime.latest",
  ]
  host_metric_include = [
    "cpu.usage.average", "cpu.usagemhz.average", "cpu.totalCapacity.average",
    "mem.usage.average", "mem.consumed.average", "mem.totalCapacity.average",
    "net.usage.average", "disk.usage.average", "sys.uptime.latest",
  ]
  datastore_metric_exclude = ["*"]
  cluster_metric_exclude = ["*"]
  datacenter_metric_exclude = ["*"]
  resource_pool_metric_exclude = ["*"]
  vsan_metric_exclude = ["*"]

# Datastores: capacity and use, from vCenter's history.
[[inputs.vsphere]]
  interval = "300s"
  vcenters = ["${VSPHERE_URL}"]
  username = "${VSPHERE_USERNAME}"
  password = "${VSPHERE_PASSWORD}"
  tls_ca = "/etc/telegraf/vsphere-ca.pem"
  datastore_metric_include = ["disk.capacity.latest", "disk.used.latest", "disk.provisioned.latest"]
  vm_metric_exclude = ["*"]
  host_metric_exclude = ["*"]
  cluster_metric_exclude = ["*"]
  datacenter_metric_exclude = ["*"]
  resource_pool_metric_exclude = ["*"]
  vsan_metric_exclude = ["*"]

# Realtime series expire quickly, so a VM that's switched off drops out within minutes.
[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
  expiration_interval = "3m"
  namedrop = ["vsphere_datastore_*"]

# Datastore series update every 30 minutes and are kept in between.
[[outputs.prometheus_client]]
  listen = ":9274"
  metric_version = 2
  expiration_interval = "45m"
  namepass = ["vsphere_datastore_*"]
  collectors_exclude = ["gocollector", "process"]
