name: Release images

# A release: pushing a version tag (vX.Y.Z) builds the five Argus images for amd64 and arm64
# and publishes them to GHCR (ghcr.io/<owner>/argus-*) and, when the DOCKERHUB_USERNAME and
# DOCKERHUB_TOKEN secrets are set, to Docker Hub (<username>/argus-*). Tags: the version
# (1.2.3), major.minor (1.2) and latest. Each image is pushed with SBOM and SLSA provenance
# attestations and signed keylessly with cosign (Sigstore, identity = this workflow on the tag).
# The GitHub Release carries the CHANGELOG.md section for the version, a source archive, the
# image digests, a signed SHA256SUMS and SLSA build provenance for those files.
# How to verify: docs/verifying-releases.md.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing: the Sigstore certificate comes from this job's OIDC token
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: argus-agent, context: agent, dockerfile: agent/Dockerfile }
          - { image: argus-grafana, context: ., dockerfile: images/grafana/Dockerfile }
          - { image: argus-prometheus, context: ., dockerfile: images/prometheus/Dockerfile }
          - { image: argus-blackbox, context: ., dockerfile: images/blackbox/Dockerfile }
          - { image: argus-loki, context: ., dockerfile: images/loki/Dockerfile }
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute the image names
        # GHCR image paths must be all-lowercase; github.repository_owner keeps the
        # account's casing ("HoneyBearTech").
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
        run: |
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          echo "GHCR_IMAGE=ghcr.io/${owner}/${IMAGE}" >> "$GITHUB_ENV"
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "DOCKERHUB_IMAGE=docker.io/${DOCKERHUB_USERNAME}/${IMAGE}" >> "$GITHUB_ENV"
          fi

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # The same digest is in both registries; each keeps its own signature.
      - name: Sign the image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ${{ matrix.image }}
        run: |
          for repo in "$GHCR_IMAGE" ${DOCKERHUB_IMAGE:+"$DOCKERHUB_IMAGE"}; do
            cosign sign --yes "${repo}@${DIGEST}"
            echo "${repo}@${DIGEST}" >> "image-${IMAGE}.txt"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ matrix.image }}
          path: image-${{ matrix.image }}.txt
          retention-days: 1

  release:
    name: GitHub Release
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release
      id-token: write # keyless signing of SHA256SUMS and of the provenance
      attestations: write # store the provenance attestation in GitHub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-*
          merge-multiple: true

      - name: Source archive, image list and checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          git archive --format=tar.gz --prefix="argus-${version}/" -o "argus-${version}.tar.gz" HEAD
          sort image-*.txt > images.txt
          sha256sum "argus-${version}.tar.gz" images.txt > SHA256SUMS
          cat images.txt SHA256SUMS

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the checksums
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS

      # SLSA build provenance for every file in SHA256SUMS: signed (Sigstore), stored as a GitHub
      # attestation (gh attestation verify) and attached as the full Sigstore bundle.
      - name: Attest build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: SHA256SUMS

      - name: Release notes from the changelog
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          version="${TAG#v}"
          cp "$BUNDLE" "argus-${version}.provenance.sigstore.json"
          # The "## [x.y.z]" section of CHANGELOG.md, up to the next "## [" heading.
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          printf '\n---\nVerify the images and this release: [docs/verifying-releases.md](https://github.com/%s/blob/%s/docs/verifying-releases.md)\n' \
            "$REPO" "$TAG" >> notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" --repo "$REPO" --verify-tag \
            --title "Argus ${TAG}" --notes-file notes.md \
            argus-*.tar.gz images.txt SHA256SUMS SHA256SUMS.sigstore.json argus-*.provenance.sigstore.json
