name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    # The required status check on main; keep this name (branch protection refers to it).
    name: Dashboards + config
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Empty for pull requests from forks (no secrets): the login below is skipped and pulls stay anonymous.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Most of the images below come from Docker Hub, whose anonymous pull limit is shared by GitHub's
      # runners and can fail CI on a busy day. A read-only token (DOCKERHUB_PULL_TOKEN) is preferred;
      # without one, the release workflow's DOCKERHUB_TOKEN is used.
      - name: Log in to Docker Hub (pull limits)
        if: env.DOCKERHUB_USERNAME != ''
        # Best effort: if Docker Hub's login is unreachable, the pulls still try anonymously.
        continue-on-error: true
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PULL_TOKEN || secrets.DOCKERHUB_TOKEN }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install the check and test tools
        run: python -m pip install --require-hashes --no-deps -r requirements-dev.txt

      # Coding standards (CONTRIBUTING.md#coding-standards). Any finding fails the build.
      - name: Lint Python (ruff)
        run: |
          ruff check --output-format github .
          ruff format --check .

      - name: Lint YAML (yamllint)
        run: yamllint --strict --format github .

      - name: Lint workflows (actionlint, with shellcheck)
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

      - name: Lint Dockerfiles (hadolint)
        run: |
          for dockerfile in images/*/Dockerfile agent/Dockerfile; do
            echo "$dockerfile"
            docker run --rm -i hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d \
              hadolint --failure-threshold style - < "$dockerfile"
          done

      # Same pinned image as agent/Dockerfile; bump both together.
      - name: Agent configs are valid and formatted (alloy fmt)
        run: |
          for config in config.alloy kubernetes.alloy; do
            docker run --rm -v "$PWD/agent/$config:/etc/alloy/$config:ro" \
              grafana/alloy:v1.20.1@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f \
              fmt "/etc/alloy/$config" | diff -u "agent/$config" -
          done

      - name: Unit tests with coverage (pytest)
        run: |
          coverage run -m pytest
          coverage report

      - name: Dashboard and public-repo checks
        run: python scripts/check_dashboards.py
        env:
          # Internal domains/hostnames to reject, one regex per line (repo secret).
          ARGUS_FORBIDDEN_PATTERNS: ${{ secrets.ARGUS_FORBIDDEN_PATTERNS }}

      # Same pinned image as images/prometheus/Dockerfile; bump both together.
      - name: Prometheus config (promtool)
        run: |
          docker run --rm \
            -v "$PWD/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/targets.example:/etc/prometheus/targets:ro" \
            -v "$PWD/secrets.example:/etc/prometheus/secrets:ro" \
            --entrypoint promtool prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e \
            check config /etc/prometheus/prometheus.yml
          docker run --rm \
            -v "$PWD/secrets.example:/w/example:ro" -v "$PWD/tests/fixtures/prometheus-auth:/w/ci:ro" \
            --entrypoint promtool prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e \
            check web-config /w/example/prometheus-web.yml /w/ci/prometheus-web.yml

      # The shipped alert rule and dashboard queries, run against synthetic series (tests/promql/).
      - name: PromQL tests (promtool)
        run: |
          python scripts/promql_tests.py --out "$RUNNER_TEMP/promql"
          docker run --rm -v "$RUNNER_TEMP/promql:/tests:ro" --entrypoint sh \
            prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e \
            -c 'promtool test rules /tests/*.yml'

      - name: snmp_exporter config (bundled modules + Synology SSD cache module + example credentials)
        run: |
          docker run --rm \
            -v "$PWD/snmp/synology-flashcache.yml:/c/synology-flashcache.yml:ro" \
            -v "$PWD/secrets.example/snmp-auth.yml:/c/auth.yml:ro" \
            --entrypoint /bin/snmp_exporter prom/snmp-exporter:v0.30.1 --dry-run \
            --config.file=/etc/snmp_exporter/snmp.yml --config.file=/c/synology-flashcache.yml --config.file=/c/auth.yml

      - name: blackbox_exporter config
        run: |
          docker run --rm \
            -v "$PWD/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro" \
            prom/blackbox-exporter:v0.29.0 \
            --config.file=/etc/blackbox/blackbox.yml --config.check

      - name: Loki config
        run: |
          docker run --rm \
            -v "$PWD/logs/loki.yaml:/etc/loki/loki.yaml:ro" \
            grafana/loki:3.7.8 \
            -config.file=/etc/loki/loki.yaml -verify-config

      - name: Images
        run: |
          docker build -t argus-agent:ci agent/
          for image in grafana prometheus blackbox loki; do
            docker build -t "argus-${image}:ci" -f "images/${image}/Dockerfile" .
          done

      # The Intel GPU exporter's image (amd64 only). The runner has no Intel GPU, so it finds none and keeps
      # answering: an empty intel_gpu_info, no intel_gpu_up. intel_gpu_top itself must be in the image.
      - name: Intel GPU exporter image answers without a GPU
        run: |
          docker build -t argus-intel-gpu-exporter:ci -f images/intel-gpu-exporter/Dockerfile .
          docker run --rm --entrypoint intel_gpu_top argus-intel-gpu-exporter:ci -h | head -1
          docker run -d --name intel-gpu-exporter --read-only --cap-drop ALL --cap-add PERFMON \
            --security-opt no-new-privileges:true -p 127.0.0.1:9836:9836 argus-intel-gpu-exporter:ci
          for _ in $(seq 20); do curl -fsS http://127.0.0.1:9836/metrics -o metrics.txt && break; sleep 1; done
          docker logs intel-gpu-exporter
          docker rm -f intel-gpu-exporter
          grep -x '# TYPE intel_gpu_up gauge' metrics.txt
          ! grep -E '^intel_gpu_(up|info)\{' metrics.txt

      # Grafana refuses to start on an invalid provisioned alert rule, so start the image and
      # check that every dashboard, alert rule, datasource and the contact point loaded. Prometheus
      # requires a password here (tests/fixtures/prometheus-auth/), which Grafana and Prometheus'
      # own scrape must send. Both run hardened as in docker-compose.yml (no capabilities, read-only
      # root, Grafana's /tmp in memory), and Grafana reads its admin password and webhook from files.
      - name: Grafana starts with everything provisioned
        run: |
          hardened=(--cap-drop ALL --security-opt no-new-privileges:true --read-only)
          printf ci > "$RUNNER_TEMP/grafana_admin_password"
          chmod 644 "$RUNNER_TEMP/grafana_admin_password"
          : > "$RUNNER_TEMP/empty_password"
          chmod 644 "$RUNNER_TEMP/empty_password"
          # Without a password the image refuses to start (Grafana would fall back to admin/admin).
          if docker run --rm "${hardened[@]}" --tmpfs /tmp \
              -v "$RUNNER_TEMP/empty_password:/run/secrets/grafana_admin_password:ro" \
              -e GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password \
              argus-grafana:ci 2> "$RUNNER_TEMP/refused.log"; then
            echo "::error::Grafana started with an empty admin password file"; exit 1
          fi
          grep -q "no Grafana admin password" "$RUNNER_TEMP/refused.log"
          docker network create argus-ci
          docker run -d --name prometheus --network argus-ci -p 127.0.0.1:9090:9090 "${hardened[@]}" \
            -v "$PWD/tests/fixtures/prometheus-auth:/etc/prometheus/secrets:ro" \
            argus-prometheus:ci \
            --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus \
            --web.config.file=/etc/prometheus/secrets/prometheus-web.yml
          # /var/lib/grafana is a volume in docker-compose.yml.
          docker run -d --name grafana --network argus-ci -p 127.0.0.1:3000:3000 "${hardened[@]}" \
            --tmpfs /tmp --tmpfs /var/lib/grafana \
            -v "$PWD/tests/fixtures/prometheus-auth/prometheus_password:/etc/grafana/secrets/prometheus_password:ro" \
            -v "$RUNNER_TEMP/grafana_admin_password:/run/secrets/grafana_admin_password:ro" \
            -v "$PWD/secrets.example/discord_webhook_url:/run/secrets/discord_webhook_url:ro" \
            -v "$PWD/secrets.example/steerhouse_db_password:/run/secrets/steerhouse_db_password:ro" \
            -v "$PWD/secrets.example/steerhouse_db_ca:/run/secrets/steerhouse_db_ca:ro" \
            -e GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password \
            -e LOKI_URL=http://loki:3100 \
            -e STEERHOUSE_DB_ADDRESS=steerhouse-db:5432 \
            argus-grafana:ci
          api() { curl -fsS -u admin:ci "http://127.0.0.1:3000$1"; }
          # /api/org needs the admin login, which Grafana creates a moment after /api/health answers.
          for _ in $(seq 60); do
            api /api/org > /dev/null 2>&1 && break
            sleep 2
          done
          fail() { echo "::error::$1"; docker logs grafana; docker logs prometheus; exit 1; }
          api /api/org > /dev/null || fail "Grafana did not start, or refused the admin password from its file"
          dashboards=$(api '/api/search?type=dash-db&limit=5000' | jq length)
          want_dashboards=$(find dashboards -name '*.json' | wc -l)
          rules=$(api /api/v1/provisioning/alert-rules | jq length)
          want_rules=$(python -c 'import yaml; print(sum(len(g["rules"]) for g in yaml.safe_load(open("provisioning/alerting/rules.yaml"))["groups"]))')
          datasources=$(api /api/datasources | jq -r '[.[].uid] | sort | join(",")')
          contact_points=$(api /api/v1/provisioning/contact-points | jq -r '[.[].name] | join(",")')
          echo "dashboards $dashboards/$want_dashboards, alert rules $rules/$want_rules, datasources $datasources, contact points $contact_points"
          [ "$dashboards" -eq "$want_dashboards" ] || fail "only $dashboards of $want_dashboards dashboards loaded"
          [ "$rules" -eq "$want_rules" ] || fail "only $rules of $want_rules alert rules loaded"
          [ "$datasources" = "loki,prometheus,steerhouse-db" ] || fail "unexpected datasources: $datasources"
          [ "$contact_points" = "Discord" ] || fail "unexpected contact points: $contact_points"
          webhook=$(api '/api/v1/provisioning/contact-points/export?decrypt=true&format=json' | jq -r '.contactPoints[0].receivers[0].settings.url')
          [ "$webhook" = "$(cat secrets.example/discord_webhook_url)" ] || fail "the contact point didn't read the webhook file: $webhook"
          steerhouse_db=$(api /api/datasources/uid/steerhouse-db | jq -r '"\(.url) \(.secureJsonFields.password)"')
          [ "$steerhouse_db" = "steerhouse-db:5432 true" ] || fail "the Steerhouse datasource didn't get its address or password file: $steerhouse_db"
          # The image removes the other bundled plugins; these three must survive it.
          for plugin in prometheus loki grafana-postgresql-datasource; do
            api "/api/plugins/$plugin/settings" > /dev/null || fail "datasource plugin $plugin is missing"
          done
          prom() { curl -sS -o /dev/null -w '%{http_code}' "$@" 'http://127.0.0.1:9090/api/v1/query?query=up'; }
          [ "$(prom)" = 401 ] || fail "Prometheus answered without a password"
          [ "$(prom -u argus:argus-ci-password)" = 200 ] || fail "Prometheus refused its password"
          datasource=$(api /api/datasources/uid/prometheus/health | jq -r .status)
          [ "$datasource" = OK ] || fail "Grafana can't query Prometheus: $datasource"
          for _ in $(seq 30); do
            self=$(curl -fsS -u argus:argus-ci-password 'http://127.0.0.1:9090/api/v1/query?query=up%7Bjob%3D%22prometheus%22%7D' | jq -r '.data.result[0].value[1]')
            [ "$self" = 1 ] && break
            sleep 2
          done
          [ "$self" = 1 ] || fail "Prometheus can't scrape itself with its password"
          echo "Prometheus requires its password; Grafana and Prometheus' own scrape send it"

      - name: Compose files
        env:
          CONFIG_ROOT: /srv/config # required by the compose file, as in .env.example
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.source.yml config --quiet
          ARGUS_PROXY_NETWORK=ci docker compose -f docker-compose.yml -f docker-compose.source.yml -f docker-compose.proxy.yml config --quiet
          ARGUS_HOST=ci ARGUS_PROMETHEUS_URL=http://ci ARGUS_LOKI_URL=http://ci docker compose -f agent/compose.yml --profile plex --profile intel-gpu config --quiet
          docker compose -f logs/compose.yml config --quiet
