name: Image scan

# Scans the six Argus images for known vulnerabilities with fixes available (Trivy, HIGH and
# CRITICAL) every week and when an image changes, and reports them to the repository's code
# scanning alerts, where each is fixed or triaged as described in docs/dependencies.md.
# Most findings come from the upstream images; they're fixed by bumping the pinned image once
# upstream ships a fix.
on:
  push:
    branches: [main]
    paths: ["images/**", "agent/Dockerfile", "agent/config.alloy", "agent/kubernetes.alloy", ".github/workflows/scan.yml"]
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload the results to code scanning
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: argus-agent, context: agent, dockerfile: agent/Dockerfile }
          - { image: argus-grafana, context: ., dockerfile: images/grafana/Dockerfile }
          - { image: argus-prometheus, context: ., dockerfile: images/prometheus/Dockerfile }
          - { image: argus-blackbox, context: ., dockerfile: images/blackbox/Dockerfile }
          - { image: argus-loki, context: ., dockerfile: images/loki/Dockerfile }
          # amd64 only: Debian builds intel-gpu-tools for amd64 and i386.
          - { image: argus-intel-gpu-exporter, context: ., dockerfile: images/intel-gpu-exporter/Dockerfile, platforms: linux/amd64 }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        env:
          IMAGE: ${{ matrix.image }}
          CONTEXT: ${{ matrix.context }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: docker build -t "${IMAGE}:scan" -f "$DOCKERFILE" "$CONTEXT"

      - name: Scan
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" \
            aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --no-progress \
            --format sarif --output /out/trivy.sarif "${IMAGE}:scan"
          jq -r '"\(.runs[0].results | length) finding(s)"' trivy.sarif

      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.image }}
