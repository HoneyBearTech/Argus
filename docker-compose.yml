# The Argus server: Grafana, Prometheus, blackbox_exporter and (optionally)
# Loki and exporters for Pi-hole, UniFi, SNMP and media apps. Runs the
# published images; per-install settings live in a gitignored .env (see
# .env.example). To run from a checkout with live-editable dashboards and
# configs instead, add docker-compose.source.yml (see that file).
name: argus

# Shared settings for the exportarr services below (one per *arr / SABnzbd app).
x-exportarr: &exportarr
  image: ghcr.io/onedr0p/exportarr:v2.3.0
  restart: unless-stopped
  environment:
    PORT: "9707"
    # Per-episode walks scale with library size; the dashboards don't need them.
    DISABLE_EPISODE_METRICS: "true"

services:
  prometheus:
    image: ${ARGUS_REGISTRY:-ghcr.io/honeybeartech}/argus-prometheus:${ARGUS_VERSION:-latest}
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-30d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-8GB}
      # Argus agents push host and container metrics here.
      - --web.enable-remote-write-receiver
    volumes:
      # Scrape targets are host-specific and never committed (see targets.example/).
      - ./targets:/etc/prometheus/targets:ro
      # Credentials Prometheus scrapes with (e.g. API keys), never committed (see secrets.example/).
      - ./secrets:/etc/prometheus/secrets:ro
      - prometheus_data:/prometheus
    ports:
      # Reachable from the monitored hosts, whose agents push metrics here.
      - ${PROMETHEUS_BIND:-0.0.0.0:9090}:9090

  # Runs HTTP and DNS probes on Prometheus' behalf. Only Prometheus talks to
  # it, so it publishes no port.
  blackbox:
    image: ${ARGUS_REGISTRY:-ghcr.io/honeybeartech}/argus-blackbox:${ARGUS_VERSION:-latest}
    restart: unless-stopped

  # Pi-hole v6 stats. Which Pi-holes, and their app passwords, come from the
  # gitignored secrets/pihole-exporter.env (see secrets.example/); without that
  # file the exporter starts but has nothing to scrape.
  pihole-exporter:
    image: ekofr/pihole-exporter:v1.2.0
    restart: unless-stopped
    env_file:
      - path: ./secrets/pihole-exporter.env
        required: false

  # UniFi Network stats (gateway, switches, APs, clients). The console URL and
  # a read-only local account come from the gitignored secrets/unpoller.env
  # (see secrets.example/); everything else is fixed here.
  unpoller:
    image: ghcr.io/unpoller/unpoller:v5.5.0
    restart: unless-stopped
    environment:
      UP_INFLUXDB_DISABLE: "true"
      UP_PROMETHEUS_HTTP_LISTEN: 0.0.0.0:9130
      UP_PROMETHEUS_INTERVAL: 30s
      UP_UNIFI_DEFAULT_SITES_0: all
      UP_UNIFI_DEFAULT_SAVE_SITES: "true"
      UP_UNIFI_DEFAULT_SAVE_DPI: "false"
      # Verify the console's TLS certificate unless told not to (UNIFI_VERIFY_SSL=false
      # in .env, for a console that still has its self-signed certificate).
      UP_UNIFI_DEFAULT_VERIFY_SSL: ${UNIFI_VERIFY_SSL:-true}
    env_file:
      - path: ./secrets/unpoller.env
        required: false

  # SNMP polling (Synology NAS etc.) using the modules bundled in the image.
  # Credentials live in the gitignored secrets/snmp-auth.yml (see
  # secrets.example/), so the service only starts where the `snmp` profile is
  # enabled (COMPOSE_PROFILES=snmp in .env) and that file exists.
  snmp-exporter:
    image: prom/snmp-exporter:v0.30.1
    restart: unless-stopped
    profiles: [snmp]
    command:
      - --config.file=/etc/snmp_exporter/snmp.yml
      - --config.file=/etc/snmp_exporter/auth.yml
    volumes:
      - ./secrets/snmp-auth.yml:/etc/snmp_exporter/auth.yml:ro

  # Media apps. Each exporter is behind its own compose profile and reads the
  # app's URL and API key (or login) from secrets/<profile>.env, so enable one
  # by adding that file and the profile name to COMPOSE_PROFILES in .env.
  exportarr-radarr:
    <<: *exportarr
    profiles: [radarr]
    command: [radarr]
    env_file:
      - path: ./secrets/radarr.env
        required: false

  exportarr-radarr4k:
    <<: *exportarr
    profiles: [radarr4k]
    command: [radarr]
    env_file:
      - path: ./secrets/radarr4k.env
        required: false

  exportarr-sonarr:
    <<: *exportarr
    profiles: [sonarr]
    command: [sonarr]
    env_file:
      - path: ./secrets/sonarr.env
        required: false

  exportarr-sonarr4k:
    <<: *exportarr
    profiles: [sonarr4k]
    command: [sonarr]
    env_file:
      - path: ./secrets/sonarr4k.env
        required: false

  exportarr-lidarr:
    <<: *exportarr
    profiles: [lidarr]
    command: [lidarr]
    env_file:
      - path: ./secrets/lidarr.env
        required: false

  exportarr-bazarr:
    <<: *exportarr
    profiles: [bazarr]
    command: [bazarr]
    env_file:
      - path: ./secrets/bazarr.env
        required: false

  exportarr-prowlarr:
    <<: *exportarr
    profiles: [prowlarr]
    command: [prowlarr]
    env_file:
      - path: ./secrets/prowlarr.env
        required: false

  exportarr-sabnzbd:
    <<: *exportarr
    profiles: [sabnzbd]
    command: [sabnzbd]
    env_file:
      - path: ./secrets/sabnzbd.env
        required: false

  qbittorrent-exporter:
    image: ghcr.io/martabal/qbittorrent-exporter:v2.0.3
    restart: unless-stopped
    profiles: [qbittorrent]
    env_file:
      - path: ./secrets/qbittorrent.env
        required: false

  # Log store for the agents' container logs. Optional (`loki` profile): Loki can
  # also run on another host with more disk (logs/compose.yml); point LOKI_URL
  # at it either way.
  loki:
    image: ${ARGUS_REGISTRY:-ghcr.io/honeybeartech}/argus-loki:${ARGUS_VERSION:-latest}
    restart: unless-stopped
    profiles: [loki]
    volumes:
      - loki_data:/loki
    ports:
      - ${LOKI_BIND:-0.0.0.0:3101}:3100

  grafana:
    image: ${ARGUS_REGISTRY:-ghcr.io/honeybeartech}/argus-grafana:${ARGUS_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD in .env}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      # Alert notifications (provisioning/alerting/contact-points.yaml). Unset
      # outside production, so a sandbox can't post to the real channel.
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-https://discord.invalid/argus-sandbox}
      # Where Loki runs: the bundled one (`loki` profile) by default.
      LOKI_URL: ${LOKI_URL:-http://loki:3100}
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - ${GRAFANA_BIND:-0.0.0.0:3000}:3000

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
