# The Argus server: Grafana, Prometheus, blackbox_exporter and (optionally)
# Loki and exporters for Pi-hole, UniFi, SNMP and media apps. Runs the
# published images; per-install settings live in a gitignored .env (see
# .env.example). To run from a checkout with live-editable dashboards and
# configs instead, add docker-compose.source.yml (see that file).
name: argus

# Shared settings for the exportarr services below (one per *arr / SABnzbd app).
# Each mounts its app's API key, secrets/<app>_api_key, as /run/secrets/api_key.
x-exportarr: &exportarr
  image: ghcr.io/onedr0p/exportarr:v2.3.0
  restart: unless-stopped
  environment:
    PORT: "9707"
    API_KEY_FILE: /run/secrets/api_key
    # Per-episode walks scale with library size; the dashboards don't need them.
    DISABLE_EPISODE_METRICS: "true"

services:
  prometheus:
    image: ${ARGUS_REGISTRY:-ghcr.io/honeybeartech}/argus-prometheus:${ARGUS_VERSION:-latest}
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-30d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-8GB}
      # Argus agents push host and container metrics here.
      - --web.enable-remote-write-receiver
      # Who may push and query: no one needs a password until it lists users.
      - --web.config.file=/etc/prometheus/secrets/prometheus-web.yml
    volumes:
      # Scrape targets are host-specific and never committed (see targets.example/).
      - ./targets:/etc/prometheus/targets:ro
      # Credentials Prometheus scrapes with (e.g. API keys), never committed (see secrets.example/).
      - ./secrets:/etc/prometheus/secrets:ro
      - prometheus_data:/prometheus
    ports:
      # Reachable from the monitored hosts, whose agents push metrics here.
      - ${PROMETHEUS_BIND:-0.0.0.0:9090}:9090

  # Runs HTTP and DNS probes on Prometheus' behalf. Only Prometheus talks to
  # it, so it publishes no port.
  blackbox:
    image: ${ARGUS_REGISTRY:-ghcr.io/honeybeartech}/argus-blackbox:${ARGUS_VERSION:-latest}
    restart: unless-stopped

  # Pi-hole v6 stats. Which Pi-holes, and their app passwords, come from the
  # gitignored secrets/pihole-exporter.env (see secrets.example/); without that
  # file the exporter starts but has nothing to scrape.
  pihole-exporter:
    image: ekofr/pihole-exporter:v1.2.0
    restart: unless-stopped
    env_file:
      - path: ./secrets/pihole-exporter.env
        required: false

  # UniFi Network stats (gateway, switches, APs, clients). The console URL and
  # a read-only local account come from the gitignored secrets/unpoller.env, its
  # password from secrets/unifi_password (see secrets.example/); everything else
  # is fixed here.
  unpoller:
    image: ghcr.io/unpoller/unpoller:v5.5.0
    restart: unless-stopped
    environment:
      UP_INFLUXDB_DISABLE: "true"
      UP_PROMETHEUS_HTTP_LISTEN: 0.0.0.0:9130
      UP_PROMETHEUS_INTERVAL: 30s
      UP_UNIFI_DEFAULT_SITES_0: all
      UP_UNIFI_DEFAULT_SAVE_SITES: "true"
      UP_UNIFI_DEFAULT_SAVE_DPI: "false"
      # Verify the console's TLS certificate unless told not to (UNIFI_VERIFY_SSL=false
      # in .env, for a console that still has its self-signed certificate).
      UP_UNIFI_DEFAULT_VERIFY_SSL: ${UNIFI_VERIFY_SSL:-true}
      # Read from the file, so the password isn't in the container's environment.
      UP_UNIFI_DEFAULT_PASS: file:///run/secrets/unifi_password
    env_file:
      - path: ./secrets/unpoller.env
        required: false
    secrets: [unifi_password]

  # SNMP polling (Synology NAS etc.) using the modules bundled in the image.
  # Credentials live in the gitignored secrets/snmp-auth.yml (see
  # secrets.example/), so the service only starts where the `snmp` profile is
  # enabled (COMPOSE_PROFILES=snmp in .env) and that file exists.
  snmp-exporter:
    image: prom/snmp-exporter:v0.30.1
    restart: unless-stopped
    profiles: [snmp]
    command:
      - --config.file=/etc/snmp_exporter/snmp.yml
      - --config.file=/etc/snmp_exporter/auth.yml
    volumes:
      - ./secrets/snmp-auth.yml:/etc/snmp_exporter/auth.yml:ro

  # Media apps. Each exporter is behind its own compose profile and reads the
  # app's URL from secrets/<profile>.env and its API key from
  # secrets/<profile>_api_key, so enable one by adding those files and the
  # profile name to COMPOSE_PROFILES in .env.
  exportarr-radarr:
    <<: *exportarr
    profiles: [radarr]
    command: [radarr]
    env_file:
      - path: ./secrets/radarr.env
        required: false
    secrets: [{source: radarr_api_key, target: api_key}]

  exportarr-radarr4k:
    <<: *exportarr
    profiles: [radarr4k]
    command: [radarr]
    env_file:
      - path: ./secrets/radarr4k.env
        required: false
    secrets: [{source: radarr4k_api_key, target: api_key}]

  exportarr-sonarr:
    <<: *exportarr
    profiles: [sonarr]
    command: [sonarr]
    env_file:
      - path: ./secrets/sonarr.env
        required: false
    secrets: [{source: sonarr_api_key, target: api_key}]

  exportarr-sonarr4k:
    <<: *exportarr
    profiles: [sonarr4k]
    command: [sonarr]
    env_file:
      - path: ./secrets/sonarr4k.env
        required: false
    secrets: [{source: sonarr4k_api_key, target: api_key}]

  exportarr-lidarr:
    <<: *exportarr
    profiles: [lidarr]
    command: [lidarr]
    env_file:
      - path: ./secrets/lidarr.env
        required: false
    secrets: [{source: lidarr_api_key, target: api_key}]

  exportarr-bazarr:
    <<: *exportarr
    profiles: [bazarr]
    command: [bazarr]
    env_file:
      - path: ./secrets/bazarr.env
        required: false
    secrets: [{source: bazarr_api_key, target: api_key}]

  exportarr-prowlarr:
    <<: *exportarr
    profiles: [prowlarr]
    command: [prowlarr]
    env_file:
      - path: ./secrets/prowlarr.env
        required: false
    secrets: [{source: prowlarr_api_key, target: api_key}]

  exportarr-sabnzbd:
    <<: *exportarr
    profiles: [sabnzbd]
    command: [sabnzbd]
    env_file:
      - path: ./secrets/sabnzbd.env
        required: false
    secrets: [{source: sabnzbd_api_key, target: api_key}]

  qbittorrent-exporter:
    image: ghcr.io/martabal/qbittorrent-exporter:v2.0.3
    restart: unless-stopped
    profiles: [qbittorrent]
    environment:
      QBITTORRENT_PASSWORD_FILE: /run/secrets/qbittorrent_password
    env_file:
      - path: ./secrets/qbittorrent.env
        required: false
    secrets: [qbittorrent_password]

  # GitLab CI pipelines and jobs, read through GitLab's API (`gitlab` profile).
  # Which GitLab and projects, and the read_api token, come from
  # secrets/gitlab.yml (see secrets.example/).
  gitlab-ci-pipelines-exporter:
    image: ghcr.io/mvisonneau/gitlab-ci-pipelines-exporter:v0.6.0
    restart: unless-stopped
    profiles: [gitlab]
    command: [run, --config, /etc/gitlab-ci-pipelines-exporter/config.yml]
    volumes:
      - ./secrets/gitlab.yml:/etc/gitlab-ci-pipelines-exporter/config.yml:ro

  # vCenter: ESXi host, VM and datastore metrics through Telegraf's vSphere input
  # (`vsphere` profile). vCenter's URL and a read-only account come from
  # secrets/vsphere.env, the account's password from secrets/vsphere_password
  # (no trailing newline: Telegraf keeps it), its CA certificate from
  # secrets/vsphere-ca.pem (see secrets.example/); the collectors are
  # configured in vsphere/telegraf.conf.
  telegraf-vsphere:
    image: telegraf:1.40.1
    restart: unless-stopped
    profiles: [vsphere]
    env_file:
      - path: ./secrets/vsphere.env
        required: false
    volumes:
      - ./vsphere/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - ./secrets/vsphere-ca.pem:/etc/telegraf/vsphere-ca.pem:ro
    secrets: [vsphere_password]

  # Proxmox VE: node, guest and storage metrics through prometheus-pve-exporter
  # (`proxmox` profile). A read-only API token comes from secrets/pve.yml, the
  # cluster's CA certificate from secrets/pve-ca.pem (see secrets.example/);
  # Prometheus names the node to ask in each scrape (targets/pve.json).
  pve-exporter:
    image: prompve/prometheus-pve-exporter:3.10.1
    restart: unless-stopped
    profiles: [proxmox]
    command: [--config.file=/run/secrets/pve.yml]
    volumes:
      - ./secrets/pve-ca.pem:/etc/pve-exporter/pve-ca.pem:ro
    secrets: [pve.yml]

  # Log store for the agents' container logs. Optional (`loki` profile): Loki can
  # also run on another host with more disk (logs/compose.yml); point LOKI_URL
  # at it either way.
  loki:
    image: ${ARGUS_REGISTRY:-ghcr.io/honeybeartech}/argus-loki:${ARGUS_VERSION:-latest}
    restart: unless-stopped
    profiles: [loki]
    volumes:
      - loki_data:/loki
    ports:
      - ${LOKI_BIND:-0.0.0.0:3101}:3100

  grafana:
    image: ${ARGUS_REGISTRY:-ghcr.io/honeybeartech}/argus-grafana:${ARGUS_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD in .env}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      # Alert notifications (provisioning/alerting/contact-points.yaml). Unset
      # outside production, so a sandbox can't post to the real channel.
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-https://discord.invalid/argus-sandbox}
      # Where Loki runs: the bundled one (`loki` profile) by default.
      LOKI_URL: ${LOKI_URL:-http://loki:3100}
    volumes:
      - grafana_data:/var/lib/grafana
      # Prometheus' password, for the provisioned datasource. Only this one
      # file: Grafana never sees the other secrets.
      - type: bind
        source: ./secrets/prometheus_password
        target: /etc/grafana/secrets/prometheus_password
        read_only: true
        bind: { create_host_path: false }
    ports:
      - ${GRAFANA_BIND:-0.0.0.0:3000}:3000

# Credentials the exporters read from files under /run/secrets/, so they don't
# show up in `docker inspect` or Portainer's container view. Each file is
# needed only by a service that runs; templates are in secrets.example/.
secrets:
  unifi_password: {file: ./secrets/unifi_password}
  radarr_api_key: {file: ./secrets/radarr_api_key}
  radarr4k_api_key: {file: ./secrets/radarr4k_api_key}
  sonarr_api_key: {file: ./secrets/sonarr_api_key}
  sonarr4k_api_key: {file: ./secrets/sonarr4k_api_key}
  lidarr_api_key: {file: ./secrets/lidarr_api_key}
  bazarr_api_key: {file: ./secrets/bazarr_api_key}
  prowlarr_api_key: {file: ./secrets/prowlarr_api_key}
  sabnzbd_api_key: {file: ./secrets/sabnzbd_api_key}
  qbittorrent_password: {file: ./secrets/qbittorrent_password}
  vsphere_password: {file: ./secrets/vsphere_password}
  pve.yml: {file: ./secrets/pve.yml}

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
