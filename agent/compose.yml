# Argus agent for one monitored Docker host: a single container that pushes
# host metrics, container metrics and container logs to the Argus server.
# Copy this file and .env.example (as .env) to the host, fill in .env, then
# `docker compose up -d`. Or use the equivalent `docker run` in the README.
name: argus-agent

services:
  agent:
    image: ${ARGUS_AGENT_IMAGE:-ghcr.io/honeybeartech/argus-agent:latest}
    container_name: argus-agent
    restart: unless-stopped
    # What the agent still needs, and why, is in docs/security.md#hardening.
    # Host network: node_exporter reads the network interfaces from /proc/net,
    # which shows only the network namespace the agent itself runs in.
    network_mode: host
    # Host PID: node_exporter finds the host's filesystems through the mount
    # table of PID 1, and cAdvisor reads each container's network counters
    # through the container's processes.
    pid: host
    # Not privileged: it runs as root but with no capability except
    # DAC_OVERRIDE, can't gain others, and its root filesystem is read-only.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Without capabilities root can only open files it owns. The agent's data
      # directory belongs to the image's alloy user (uid 473), and the host
      # files it reads (logs, mount points under private directories) can
      # belong to anyone. Every host mount is read-only, so it can't write them.
      - DAC_OVERRIDE
    # It writes only its data volume.
    read_only: true
    environment:
      ARGUS_HOST: ${ARGUS_HOST:?set ARGUS_HOST in .env}
      ARGUS_PROMETHEUS_URL: ${ARGUS_PROMETHEUS_URL:?set ARGUS_PROMETHEUS_URL in .env}
      ARGUS_LOKI_URL: ${ARGUS_LOKI_URL:?set ARGUS_LOKI_URL in .env}
      ARGUS_PROMETHEUS_PASSWORD: ${ARGUS_PROMETHEUS_PASSWORD:-}
    volumes:
      - /:/rootfs:ro,rslave
      - /sys:/sys:ro
      - /run/udev:/run/udev:ro
      - /dev/disk:/dev/disk:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # cAdvisor reads containers through containerd when Docker uses the containerd image store
      # (the default for new installs since Docker 29); without it there are no container metrics.
      - /run/containerd:/run/containerd:ro
      # Nginx Proxy Manager access logs, only on the host that runs it.
      - ${NPM_LOG_DIR:-./no-npm-logs}:/var/log/npm:ro
      # homelab-pull's state (its metrics files and deploys.log), only on the
      # hosts it deploys.
      - ${HOMELAB_PULL_DIR:-./no-homelab-pull}:/var/lib/homelab-pull:ro
      - agent_data:/var/lib/alloy/data

  # Plex playback, transcode, library and host metrics — only on a Plex host
  # (COMPOSE_PROFILES=plex). Prometheus scrapes it (job `plex`). The image is
  # amd64-only.
  plex-exporter:
    image: ghcr.io/jsclayton/prometheus-plex-exporter@sha256:18ef1b2197efbcb75bd7276380955760995f10a9fbe55106809a6fcff91c2940
    container_name: argus-plex-exporter
    restart: unless-stopped
    profiles: [plex]
    # The image runs as root; it needs no file at all.
    user: "65534:65534"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    environment:
      PLEX_SERVER: ${PLEX_SERVER:-http://localhost:32400}
      # The exporter reads its token only from the environment.
      PLEX_TOKEN: ${PLEX_TOKEN:-}
    ports:
      - 9594:9000

volumes:
  agent_data:
