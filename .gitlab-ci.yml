# GitLab CI for the copy of this repository on the maintainer's self-hosted GitLab (Community Edition, on the LAN).
# GitHub is the project's home: every change lands there first, through a pull request that GitHub Actions
# (.github/workflows/) must pass. This pipeline keeps the GitLab copy in step and re-checks what arrives:
# - mirror: on a schedule, fetches main and the tags from GitHub and pushes them here, fast-forward only, so a
#   commit made on GitLab directly stops the mirror rather than being overwritten. GitLab CE can't pull-mirror, and
#   GitHub can't reach this GitLab. It pushes with a project access token (Maintainer, write_repository) held in the
#   masked, protected CI/CD variable MIRROR_TOKEN, and doesn't run without it.
# - the checks of ci.yml's "Dashboards + config" that need no Docker daemon, on every commit pushed here: ruff,
#   yamllint, the unit tests with the coverage floor, the dashboard and public-repo check (the internal names it
#   rejects come from the CI/CD variable ARGUS_FORBIDDEN_PATTERNS, as on GitHub; without it only private IPs are
#   checked, with a warning), the workflow lint, hadolint, the agent's `alloy fmt` diff, promtool's config check
#   and PromQL tests, blackbox_exporter's config check and the Compose files. The image builds and the Grafana boot
#   test need a daemon (Docker-in-Docker, so a privileged runner) and run on GitHub only, as do the Loki config
#   check (its image has no shell for a GitLab job) and the snmp_exporter one (its image isn't pinned by digest).
# Images are pinned by tag and digest. Dependabot doesn't read this file: they're bumped by hand
# (docs/dependencies.md), together with ci.yml and the Dockerfiles that use the same image.

workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "push"

default:
  interruptible: true
  timeout: 15m

stages: [mirror, config, checks]

.checks:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success

mirror:
  stage: mirror
  image:
    name: alpine/git:v2.54.0@sha256:a4bb51f1a3553df194ce679fc1db721d8bfba2046fa1a88fe9d4ac551ffbce25
    entrypoint: [""]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $MIRROR_TOKEN
  variables:
    GIT_STRATEGY: none
    MIRROR_SOURCE: https://github.com/HoneyBearTech/Argus.git
  # The token reaches git through a credential helper for this GitLab only, never a URL or an argument. The repo
  # is bare: git refuses to fetch into a checked-out branch, which main would be wherever init.defaultBranch=main.
  script:
    - git init -q --bare mirror && cd mirror
    - git config "credential.$CI_SERVER_URL.helper" '!f() { echo username=oauth2; echo "password=$MIRROR_TOKEN"; }; f'
    - git fetch --no-tags "$MIRROR_SOURCE" "refs/heads/main:refs/heads/main" "refs/tags/*:refs/tags/*"
    - git push "$CI_SERVER_URL/$CI_PROJECT_PATH.git" "refs/heads/main:refs/heads/main" "refs/tags/*:refs/tags/*"

# docker compose config needs only the CLI, not a daemon. The same files and settings as ci.yml's "Compose files".
compose-config:
  extends: .checks
  stage: config
  image: docker:29.8.2-cli@sha256:35cfcf893c20f2931f4909151b5407aaaeab711277de7ce8b8f521f095d54c32
  variables:
    CONFIG_ROOT: /srv/config # required by the compose file, as in .env.example
  script:
    - docker compose config --quiet
    - docker compose -f docker-compose.yml -f docker-compose.source.yml config --quiet
    - ARGUS_PROXY_NETWORK=ci docker compose -f docker-compose.yml -f docker-compose.source.yml -f docker-compose.proxy.yml config --quiet
    - ARGUS_HOST=ci ARGUS_PROMETHEUS_URL=http://ci ARGUS_LOKI_URL=http://ci docker compose -f agent/compose.yml --profile plex config --quiet
    - docker compose -f logs/compose.yml config --quiet

# check_dashboards.py and the tests run git (ls-files), which the slim image lacks; it comes from Debian's signed
# archive. The resolved PromQL tests go to the promtool job.
checks:
  extends: .checks
  stage: checks
  needs: []
  image: python:3.14.8-slim-trixie@sha256:f85c5697265c178cc6887276c55fe16cf3d14ca35c3df6a5eab3b360534a55d2
  variables:
    DEBIAN_FRONTEND: noninteractive
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
  script:
    - apt-get -o Acquire::Retries=3 update -qq
    - apt-get -o Acquire::Retries=3 install -qq -y --no-install-recommends git > /dev/null
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - python -m pip install -q --root-user-action=ignore --require-hashes --no-deps -r requirements-dev.txt
    - ruff check .
    - ruff format --check .
    - yamllint --strict .
    - coverage run -m pytest -q
    - coverage report
    - python scripts/check_dashboards.py
    - python scripts/promql_tests.py --out promql-tests
  artifacts:
    paths: [promql-tests/]
    expire_in: 1 day

# Same pinned image as images/prometheus/Dockerfile. The config names its targets and secrets by absolute path;
# the image's /etc/prometheus belongs to its user, so the examples are linked in where ci.yml mounts them.
promtool:
  extends: .checks
  stage: checks
  needs: [checks]
  image:
    name: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    entrypoint: [""]
  script:
    - ln -s "$CI_PROJECT_DIR/targets.example" /etc/prometheus/targets
    - ln -s "$CI_PROJECT_DIR/secrets.example" /etc/prometheus/secrets
    - promtool check config prometheus/prometheus.yml
    - promtool check web-config secrets.example/prometheus-web.yml tests/fixtures/prometheus-auth/prometheus-web.yml
    - promtool test rules promql-tests/*.yml

# Same pinned image as agent/Dockerfile.
alloy-fmt:
  extends: .checks
  stage: checks
  needs: []
  image:
    name: grafana/alloy:v1.20.1@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f
    entrypoint: [""]
  script:
    - alloy fmt agent/config.alloy | diff -u agent/config.alloy -

# Same pinned image as images/blackbox/Dockerfile.
blackbox-config:
  extends: .checks
  stage: checks
  needs: []
  image:
    name: prom/blackbox-exporter:v0.29.0@sha256:9613f2884689b6fad9f1939f6a3b0388c93a022cfaededb19545b329b5c83dea
    entrypoint: [""]
  script:
    - blackbox_exporter --config.file=blackbox/blackbox.yml --config.check

# ci.yml's hadolint image has no shell, which a GitLab job needs; this is the same release's Alpine variant.
hadolint:
  extends: .checks
  stage: checks
  needs: []
  image:
    name: hadolint/hadolint:v2.15.1-alpine@sha256:a1d49ae1a4e83c1dbad26b8c1ad7588c8bd1e04f4866b34ad3cac50335198552
    entrypoint: [""]
  script:
    - |
      for dockerfile in images/*/Dockerfile agent/Dockerfile; do
        echo "$dockerfile"
        hadolint --failure-threshold style - < "$dockerfile"
      done

actionlint:
  extends: .checks
  stage: checks
  needs: []
  image:
    name: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
    entrypoint: [""]
  script:
    - actionlint -color
