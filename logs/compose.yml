# Loki on its own host — for when the Argus server's disk is too small for
# logs. Copy this file to that host, run `docker compose up -d`, and set
# LOKI_URL (server .env) and ARGUS_LOKI_URL (agents) to http://<this-host>:3101.
# (On a single server, use the `loki` profile in the main compose file instead.)
name: argus-logs

services:
  loki:
    image: ${ARGUS_REGISTRY:-ghcr.io/honeybeartech}/argus-loki:${ARGUS_VERSION:-latest}
    container_name: argus-loki
    restart: unless-stopped
    volumes:
      - loki_data:/loki
    ports:
      - 3101:3100

volumes:
  loki_data:
