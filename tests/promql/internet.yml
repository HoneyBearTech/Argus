# Internet / ISP dashboard. unpoller reports a speed test and a plan speed per WAN; the backup WAN
# (WAN2) has never run a test and has no plan, so it reports zeros that must not count. Device series
# come once per UniFi device tag.
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'unpoller_speedtest_download_mbps{wan_group="WAN", wan_interface="eth9"}'
        values: "4000x10"
      - series: 'unpoller_speedtest_download_mbps{wan_group="WAN2", wan_interface="eth9"}'
        values: "0x10"
      - series: 'unpoller_wan_provider_download_kbps{wan_networkgroup="WAN", wan_name="Internet 1"}'
        values: "8000000x10"
      - series: 'unpoller_wan_provider_download_kbps{wan_networkgroup="WAN2", wan_name="Internet 2"}'
        values: "0x10"
      - series: 'unpoller_device_speedtest_rundate_seconds{name="gw", port="if!eth9", tag="Core"}'
        values: "300x10"
      - series: 'unpoller_device_speedtest_rundate_seconds{name="gw", port="if!eth9", tag="Rack"}'
        values: "300x10"
    promql_expr_test:
      - dashboard: argus-internet
        panel: Download
        eval_time: 10m
        exp_samples:
          - labels: "{}"
            value: 4000
      - dashboard: argus-internet
        panel: Download vs usual
        ref_id: B
        eval_time: 10m
        exp_samples:
          # 4000 Mbps of an 8 Gbps plan; WAN2's zeros neither win the max nor divide by zero.
          - labels: "{}"
            value: 0.5
      - dashboard: argus-internet
        panel: Speed test history
        ref_id: C
        eval_time: 10m
        exp_samples:
          - labels: "{}"
            value: 8000
      - dashboard: argus-internet
        panel: Since last test
        eval_time: 10m
        exp_samples:
          # Ran at t=300 s, evaluated at 600 s; the per-tag duplicate doesn't change it.
          - labels: "{}"
            value: 300

  # No plan speed set in UniFi: the comparison shows "no value" instead of infinity.
  - interval: 1m
    input_series:
      - series: 'unpoller_speedtest_upload_mbps{wan_group="WAN"}'
        values: "5000x10"
      - series: 'unpoller_wan_provider_upload_kbps{wan_networkgroup="WAN"}'
        values: "0x10"
    promql_expr_test:
      - dashboard: argus-internet
        panel: Upload vs usual
        ref_id: B
        eval_time: 10m
        exp_samples: []
      - dashboard: argus-internet
        panel: Speed test history
        ref_id: D
        eval_time: 10m
        exp_samples: []

  # Drops in the selected range count each loss of connectivity once (3 here). increase() extrapolates
  # the 9 minutes between the first and last sample in the window to the full 10, so the query returns
  # 3.33; the panel shows it with no decimals.
  - interval: 1m
    input_series:
      - series: 'unpoller_site_intenet_drops_total{subsystem="www", site_name="a"}'
        values: "5 5 5 6 6 6 8 8 8 8 8"
    promql_expr_test:
      - dashboard: argus-internet
        panel: Internet drops
        vars: { __range: 10m }
        eval_time: 10m
        exp_samples:
          - labels: "{}"
            value: 3.3333333333333335

  # Alert "Internet much slower than usual": compared with the line's own 14-day median, not the plan.
  # Two weeks of normal results (download ~38 % of an 8 Gbps plan, as on a gateway that can't test the
  # full plan), then download drops to 40 % of its median; upload stays normal.
  - interval: 1h
    input_series:
      - series: 'unpoller_speedtest_download_mbps{wan_group="WAN", wan_interface="eth9"}'
        values: "3000x336 1200x2"
      - series: 'unpoller_speedtest_upload_mbps{wan_group="WAN", wan_interface="eth9"}'
        values: "5000x338"
      - series: 'unpoller_wan_provider_download_kbps{wan_networkgroup="WAN"}'
        values: "8000000x338"
    promql_expr_test:
      # Steady results far below the plan don't alert.
      - rule: argus-internet-slow
        eval_time: 330h
        exp_samples: []
      - rule: argus-internet-slow
        eval_time: 338h
        exp_samples:
          - labels: '{direction="download"}'
            value: 0.4
      # The dashboard tiles show the same "of usual" ratio the alert uses.
      - dashboard: argus-internet
        panel: Download vs usual
        eval_time: 338h
        exp_samples:
          - labels: "{}"
            value: 0.4
      - dashboard: argus-internet
        panel: Upload vs usual
        eval_time: 338h
        exp_samples:
          - labels: "{}"
            value: 1

  # Alert "No internet speed test in 8 days": the last test ran at t=1h.
  - interval: 1h
    input_series:
      - series: 'unpoller_device_speedtest_rundate_seconds{name="gw", tag="Core"}'
        values: "3600x240"
    promql_expr_test:
      - rule: argus-speedtest-stale
        eval_time: 150h
        exp_samples: []
      - rule: argus-speedtest-stale
        eval_time: 200h
        exp_samples:
          # 199 h = 8.3 days
          - labels: "{}"
            value: 716400
