# Firing, healthy/boundary, and absent-series cases for the shipped query.
evaluation_interval: 1m
tests:
- interval: 1m
  input_series:
  - series: unpoller_site_intenet_drops_total{subsystem="www",site="failed"}
    values: 0+1x20
  - series: unpoller_site_intenet_drops_total{subsystem="www",site="healthy"}
    values: '0x20'
  - series: unpoller_site_intenet_drops_total{subsystem="other"}
    values: 0+100x20
  promql_expr_test:
  - rule: argus-internet-drops
    eval_time: 15m
    exp_samples:
    - labels: '{}'
      value: 15
- interval: 1m
  input_series: []
  promql_expr_test:
  - rule: argus-internet-drops
    eval_time: 15m
    exp_samples: []
