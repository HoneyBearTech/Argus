# GPUs dashboard and the GPU alerts. Per-GPU series carry uuid (and host from targets/gpu.json); the model
# and index come from nvidia_smi_gpu_info. h1: a GPU at 60 °C, encoding. h2: the exporter answers but
# nvidia-smi fails, so it lists no GPU (the driver was removed). h3: a GPU at 90 °C.
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'up{job="gpu", host="h1", instance="h1:9835"}'
        values: "1x15"
      - series: 'up{job="gpu", host="h2", instance="h2:9835"}'
        values: "1x15"
      - series: 'up{job="gpu", host="h3", instance="h3:9835"}'
        values: "1x15"
      - series: 'nvidia_smi_gpu_info{job="gpu", host="h1", instance="h1:9835", uuid="u1", name="Quadro P1000", index="0", driver_version="580.178.04"}'
        values: "1x15"
      - series: 'nvidia_smi_gpu_info{job="gpu", host="h3", instance="h3:9835", uuid="u3", name="Quadro P1000", index="0", driver_version="580.178.04"}'
        values: "1x15"
      - series: 'nvidia_smi_temperature_gpu{job="gpu", host="h1", instance="h1:9835", uuid="u1"}'
        values: "60x15"
      - series: 'nvidia_smi_temperature_gpu{job="gpu", host="h3", instance="h3:9835", uuid="u3"}'
        values: "90x15"
      - series: 'nvidia_smi_utilization_encoder_ratio{job="gpu", host="h1", instance="h1:9835", uuid="u1"}'
        values: "0.4x15"
      - series: 'nvidia_smi_utilization_encoder_ratio{job="gpu", host="h3", instance="h3:9835", uuid="u3"}'
        values: "0x15"
      - series: 'nvidia_smi_memory_used_bytes{job="gpu", host="h1", instance="h1:9835", uuid="u1"}'
        values: "1000x15"
      - series: 'nvidia_smi_memory_total_bytes{job="gpu", host="h1", instance="h1:9835", uuid="u1"}'
        values: "4000x15"
    promql_expr_test:
      - rule: argus-gpu-not-reporting
        eval_time: 10m
        exp_samples:
          - labels: '{host="h2"}'
            value: 1
      # Every GPU host keeps a series, so the summary always has a value.
      - rule: argus-gpu-not-reporting
        measurement: true
        eval_time: 10m
        exp_samples:
          - labels: '{host="h1"}'
            value: 0
          - labels: '{host="h2"}'
            value: 1
          - labels: '{host="h3"}'
            value: 0
      - rule: argus-gpu-hot
        eval_time: 10m
        exp_samples:
          - labels: '{host="h3", uuid="u3", name="Quadro P1000"}'
            value: 90
      - dashboard: argus-gpus
        panel: 1
        vars: {host: ".*"}
        eval_time: 10m
        exp_samples:
          - labels: "{}"
            value: 2
      - dashboard: argus-gpus
        panel: Hottest GPU
        vars: {host: ".*"}
        eval_time: 10m
        exp_samples:
          - labels: "{}"
            value: 90
      - dashboard: argus-gpus
        panel: Encoder busy
        vars: {host: ".*"}
        eval_time: 10m
        exp_samples:
          - labels: "{}"
            value: 40
      # The table's Memory used, keyed host/uuid.
      - dashboard: argus-gpus
        panel: 7
        ref_id: F
        vars: {host: ".*"}
        eval_time: 10m
        exp_samples:
          - labels: '{key="h1/u1"}'
            value: 25
      # The charts name each GPU by host and index.
      - dashboard: argus-gpus
        panel: Video encoder and decoder
        vars: {host: "h1"}
        eval_time: 10m
        exp_samples:
          - labels: '{job="gpu", host="h1", instance="h1:9835", uuid="u1", name="Quadro P1000", index="0"}'
            value: 40

  # NVIDIA and Intel GPUs together. n1: an NVIDIA GPU at 60 °C drawing 50 W. i1: a server whose i915 driver has an
  # Intel card at 0000:43:00.0 (Intel GPU exporter, job intel_gpu; hwmon, job hwmon): Video busy half the time,
  # 70 °C, 20 W (1200 J a minute). i2: a server whose Intel card is passed through to a VM: listed, not a GPU it
  # reports. c1: a container on i1 (the Argus agent in an LXC, job node) that sees the same card's hwmon sensors
  # through the host's sysfs, but runs no Intel GPU exporter: not a second GPU, its power not counted twice.
  - interval: 1m
    input_series:
      - series: 'node_hwmon_chip_names{job="node", host="c1", instance="c1", chip="0000:42:01_0_0000:43:00_0", chip_name="i915"}'
        values: "1x15"
      - series: 'node_hwmon_temp_celsius{job="node", host="c1", instance="c1", chip="0000:42:01_0_0000:43:00_0", sensor="temp1"}'
        values: "80x15"
      - series: 'node_hwmon_energy_joule_total{job="node", host="c1", instance="c1", chip="0000:42:01_0_0000:43:00_0", sensor="energy1"}'
        values: "0+1200x15"
      - series: 'nvidia_smi_gpu_info{job="gpu", host="n1", instance="n1:9835", uuid="u1", name="Quadro P1000", index="0", driver_version="580.178.04"}'
        values: "1x15"
      - series: 'nvidia_smi_temperature_gpu{job="gpu", host="n1", instance="n1:9835", uuid="u1"}'
        values: "60x15"
      - series: 'nvidia_smi_power_draw_watts{job="gpu", host="n1", instance="n1:9835", uuid="u1"}'
        values: "50x15"
      - series: 'intel_gpu_info{job="intel_gpu", host="i1", instance="i1:9836", pci_slot="0000:43:00.0", driver="i915"}'
        values: "1x15"
      - series: 'intel_gpu_up{job="intel_gpu", host="i1", instance="i1:9836", pci_slot="0000:43:00.0"}'
        values: "1x15"
      - series: 'intel_gpu_engine_busy_seconds_total{job="intel_gpu", host="i1", instance="i1:9836", pci_slot="0000:43:00.0", engine="Video"}'
        values: "0+30x15"
      - series: 'intel_gpu_engine_busy_seconds_total{job="intel_gpu", host="i1", instance="i1:9836", pci_slot="0000:43:00.0", engine="Blitter"}'
        values: "0+60x15"
      - series: 'intel_gpu_frequency_hertz{job="intel_gpu", host="i1", instance="i1:9836", pci_slot="0000:43:00.0", type="actual"}'
        values: "2000000000x15"
      - series: 'node_hwmon_chip_names{job="hwmon", host="i1", instance="i1:9100", chip="0000:42:01_0_0000:43:00_0", chip_name="i915"}'
        values: "1x15"
      - series: 'node_hwmon_temp_celsius{job="hwmon", host="i1", instance="i1:9100", chip="0000:42:01_0_0000:43:00_0", sensor="temp1"}'
        values: "70x15"
      - series: 'node_hwmon_energy_joule_total{job="hwmon", host="i1", instance="i1:9100", chip="0000:42:01_0_0000:43:00_0", sensor="energy1"}'
        values: "0+1200x15"
      - series: 'intel_gpu_info{job="intel_gpu", host="i2", instance="i2:9836", pci_slot="0000:43:00.0", driver="vfio-pci"}'
        values: "1x15"
    promql_expr_test:
      # The passed-through card isn't counted.
      - dashboard: argus-gpus
        panel: 1
        vars: {host: ".*"}
        eval_time: 10m
        exp_samples:
          - labels: "{}"
            value: 2
      - dashboard: argus-gpus
        panel: Hottest GPU
        vars: {host: ".*"}
        eval_time: 10m
        exp_samples:
          - labels: "{}"
            value: 70
      - dashboard: argus-gpus
        panel: Power
        vars: {host: ".*"}
        eval_time: 10m
        exp_samples:
          - labels: "{}"
            value: 70
      - dashboard: argus-gpus
        panel: Intel GPUs
        ref_id: B
        vars: {host: ".*"}
        eval_time: 10m
        exp_samples:
          - labels: '{key="i1/0000:43:00.0"}'
            value: 2
          - labels: '{key="i2/0000:43:00.0"}'
            value: 0
      - dashboard: argus-gpus
        panel: Intel GPUs
        ref_id: C
        vars: {host: ".*"}
        eval_time: 10m
        exp_samples:
          - labels: '{key="i1/0000:43:00.0"}'
            value: 50
      - dashboard: argus-gpus
        panel: Intel GPUs
        ref_id: G
        vars: {host: ".*"}
        eval_time: 10m
        exp_samples:
          - labels: '{key="i1/0000:43:00.0"}'
            value: 70
      - dashboard: argus-gpus
        panel: Intel GPUs
        ref_id: H
        vars: {host: ".*"}
        eval_time: 10m
        exp_samples:
          - labels: '{key="i1/0000:43:00.0"}'
            value: 20
      - dashboard: argus-gpus
        panel: Intel engines
        vars: {host: ".*", __rate_interval: "2m"}
        eval_time: 10m
        exp_samples:
          - labels: '{host="i1", pci_slot="0000:43:00.0", engine="Video"}'
            value: 50
      - dashboard: argus-gpus
        panel: Intel temperature and power
        vars: {host: ".*"}
        eval_time: 10m
        exp_samples:
          - labels: '{host="i1", pci_slot="0000:43:00.0"}'
            value: 70
      - dashboard: argus-gpus
        panel: Intel temperature and power
        ref_id: B
        vars: {host: ".*", __rate_interval: "2m"}
        eval_time: 10m
        exp_samples:
          - labels: '{host="i1", pci_slot="0000:43:00.0"}'
            value: 20
