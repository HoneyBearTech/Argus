# Server Hardware's GPU panels and the GPU hot alert's hwmon half: Intel discrete GPUs read by the host's own
# i915 or xe driver, through node_exporter's hwmon collector. s1: a server (job hwmon) with the card at
# 0000:43:00.0 behind the card's own PCIe switch; it heats up to 90 °C at minute 5. Its CPUs (coretemp) are
# hotter still, but aren't a GPU. s2: a VM the card is passed through to (the Argus agent, job node), where it
# sits at 0000:00:10.0. s3: a server with no GPU. h3: an NVIDIA GPU (job gpu) at 90 °C, for the alert's other half.
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'node_hwmon_chip_names{job="hwmon", host="s1", instance="s1:9100", chip="0000:42:01_0_0000:43:00_0", chip_name="i915"}'
        values: "1x10"
      - series: 'node_hwmon_temp_celsius{job="hwmon", host="s1", instance="s1:9100", chip="0000:42:01_0_0000:43:00_0", sensor="temp1"}'
        values: "45 45 45 45 45 90 90 90 90 90 90"
      - series: 'node_hwmon_fan_rpm{job="hwmon", host="s1", instance="s1:9100", chip="0000:42:01_0_0000:43:00_0", sensor="fan1"}'
        values: "3160x10"
      - series: 'node_hwmon_chip_names{job="hwmon", host="s1", instance="s1:9100", chip="platform_coretemp_0", chip_name="coretemp"}'
        values: "1x10"
      - series: 'node_hwmon_temp_celsius{job="hwmon", host="s1", instance="s1:9100", chip="platform_coretemp_0", sensor="temp1"}'
        values: "95x10"
      - series: 'node_hwmon_chip_names{job="node", host="s2", instance="s2", chip="pci0000:00_0000:00:10_0", chip_name="i915"}'
        values: "1x10"
      - series: 'node_hwmon_temp_celsius{job="node", host="s2", instance="s2", chip="pci0000:00_0000:00:10_0", sensor="temp1"}'
        values: "60x10"
      - series: 'node_hwmon_chip_names{job="hwmon", host="s3", instance="s3:9100", chip="platform_coretemp_0", chip_name="coretemp"}'
        values: "1x10"
      - series: 'node_hwmon_temp_celsius{job="hwmon", host="s3", instance="s3:9100", chip="platform_coretemp_0", sensor="temp1"}'
        values: "50x10"
      - series: 'nvidia_smi_gpu_info{job="gpu", host="h3", instance="h3:9835", uuid="u3", name="Quadro P1000", index="0", driver_version="580.178.04"}'
        values: "1x10"
      - series: 'nvidia_smi_temperature_gpu{job="gpu", host="h3", instance="h3:9835", uuid="u3"}'
        values: "90x10"
    promql_expr_test:
      # Every GPU, by its PCI address; never the CPUs.
      - rule: argus-gpu-hot
        measurement: true
        eval_time: 2m
        exp_samples:
          - labels: '{host="h3", uuid="u3", name="Quadro P1000"}'
            value: 90
          - labels: '{host="s1", chip="0000:42:01_0_0000:43:00_0", name="Intel GPU 0000:43:00.0"}'
            value: 45
          - labels: '{host="s2", chip="pci0000:00_0000:00:10_0", name="Intel GPU 0000:00:10.0"}'
            value: 60
      - rule: argus-gpu-hot
        eval_time: 2m
        exp_samples:
          - labels: '{host="h3", uuid="u3", name="Quadro P1000"}'
            value: 90
      - rule: argus-gpu-hot
        eval_time: 6m
        exp_samples:
          - labels: '{host="h3", uuid="u3", name="Quadro P1000"}'
            value: 90
          - labels: '{host="s1", chip="0000:42:01_0_0000:43:00_0", name="Intel GPU 0000:43:00.0"}'
            value: 90
      # The CPUs at 95 °C don't count.
      - dashboard: argus-hardware
        panel: Hottest GPU
        vars: {host: ".*"}
        eval_time: 2m
        exp_samples:
          - labels: "{}"
            value: 60
      - dashboard: argus-hardware
        panel: Hottest GPU
        vars: {host: ".*"}
        eval_time: 6m
        exp_samples:
          - labels: "{}"
            value: 90
      - dashboard: argus-hardware
        panel: Hottest GPU
        vars: {host: "s1"}
        eval_time: 2m
        exp_samples:
          - labels: "{}"
            value: 45
      # A server without a GPU: no value ("No GPU reporting"), not 0 °C.
      - dashboard: argus-hardware
        panel: Hottest GPU
        vars: {host: "s3"}
        eval_time: 2m
        exp_samples: []
      - dashboard: argus-hardware
        panel: GPU temperature
        vars: {host: ".*"}
        eval_time: 2m
        exp_samples:
          - labels: '{host="s1", chip="0000:42:01_0_0000:43:00_0", gpu="0000:43:00.0"}'
            value: 45
          - labels: '{host="s2", chip="pci0000:00_0000:00:10_0", gpu="0000:00:10.0"}'
            value: 60
      - dashboard: argus-hardware
        panel: GPU fan speed
        vars: {host: ".*"}
        eval_time: 2m
        exp_samples:
          - labels: '{host="s1", chip="0000:42:01_0_0000:43:00_0", gpu="0000:43:00.0"}'
            value: 3160
