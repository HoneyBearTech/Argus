apiVersion: 1

# Dashboards reference these by uid, so the uids must never change.
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s

  # Logs (logs/compose.yml). The URL is host-specific, so it comes from the
  # LOKI_URL environment variable.
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: ${LOKI_URL}
    editable: false
    jsonData:
      maxLines: 1000
