apiVersion: 1

# Dashboards reference these by uid, so the uids must never change.
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    # Sent always; Prometheus checks it once secrets/prometheus-web.yml lists users.
    basicAuth: true
    basicAuthUser: argus
    jsonData:
      timeInterval: 15s
    secureJsonData:
      basicAuthPassword: $__file{/etc/grafana/secrets/prometheus_password}

  # Logs (logs/compose.yml). The URL is host-specific, so it comes from the
  # LOKI_URL environment variable.
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: ${LOKI_URL}
    editable: false
    jsonData:
      maxLines: 1000
