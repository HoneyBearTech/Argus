# Grafana-managed alert rules, provisioned from this file (edit here, not in the UI).
# Each rule: A = the raw PromQL measurement, C = the threshold on A; one alert per series.
apiVersion: 1
groups:
- orgId: 1
  name: Availability
  folder: Argus
  interval: 1m
  rules:
  - uid: argus-host-down
    title: Host stopped reporting
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max by (host) (up{job="node"}) or max by (host) (max_over_time(up{job="node"}[1d])) * 0
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
    noDataState: OK
    execErrState: Error
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: '{{ $labels.host }} reported in the last day but its Argus agent has gone silent (agent stopped or the host
        is down).'
    isPaused: false
  - uid: argus-service-down
    title: Service down
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max_over_time(probe_success{job="blackbox_http"}[5m]) and on (instance) (sum_over_time(probe_success{job="blackbox_http"}[7d])
          > 60)
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
    noDataState: OK
    execErrState: Error
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: '{{ $labels.service }} ({{ $labels.group }}) has failed every probe for 5 minutes.'
    isPaused: false
  - uid: argus-dns-down
    title: DNS server not answering
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: probe_success{job="blackbox_dns"}
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
    noDataState: OK
    execErrState: Error
    for: 3m
    labels:
      severity: critical
    annotations:
      summary: '{{ $labels.service }} isn''t resolving names.'
    isPaused: false
  - uid: argus-exporter-down
    title: Monitoring target down
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: up{job!="node"}
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
    noDataState: OK
    execErrState: Error
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: Prometheus can't scrape {{ $labels.job }} at {{ $labels.instance }} — the dashboards relying on it are missing
        data.
    isPaused: false
  - uid: argus-pve-quorum-lost
    title: Proxmox cluster without quorum
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: min by (instance) (pve_up{job="pve_quorum", id=~"cluster/.+"})
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
    noDataState: OK
    execErrState: Error
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: The Proxmox node at {{ $labels.instance }} has no cluster quorum — guests on it can't be started, migrated
        or changed until enough nodes (or the QDevice) are back.
    isPaused: false
  - uid: argus-pve-qdevice-down
    title: Proxmox QDevice disconnected
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: min by (instance) (pve_qdevice_up{job="pve_quorum"})
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
    noDataState: OK
    execErrState: Error
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: The Proxmox node at {{ $labels.instance }} has lost the cluster's QDevice — one more node going down would
        cost the cluster its quorum.
    isPaused: false
  # The GPU exporter answers but lists no GPU: nvidia-smi fails (the driver was removed or didn't load
  # after an update). An exporter that doesn't start at all is "Monitoring target down".
  - uid: argus-gpu-not-reporting
    title: GPU not reporting
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: (max by (host) (up{job="gpu"}) unless on (host) max by (host) (nvidia_smi_gpu_info{job="gpu"}))
          or on (host) max by (host) (nvidia_smi_gpu_info{job="gpu"}) * 0
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: 'The GPU exporter on {{ $labels.host }} reports no GPU (nvidia-smi fails; is the NVIDIA driver loaded?), so GPU transcoding there won''t work.'
    isPaused: false
- orgId: 1
  name: Capacity
  folder: Argus
  interval: 5m
  rules:
  - uid: argus-disk-full
    title: Disk almost full
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: 100 * (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|nsfs|ramfs|fuse.*|vfat|nfs.*|cifs"} /
          node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|nsfs|ramfs|fuse.*|vfat|nfs.*|cifs"})
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 90
    noDataState: OK
    execErrState: Error
    for: 30m
    labels:
      severity: warning
    annotations:
      summary: '{{ $labels.host }} {{ $labels.mountpoint }} is {{ printf "%.1f" $values.A.Value }}% full.'
    isPaused: false
  - uid: argus-pool-full
    title: NAS storage pool almost full
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        # Volumes only: a storage pool's free space is what isn't allocated to a volume yet,
        # so a pool given entirely to its volumes reads 100 % full; SSD caches are always full.
        expr: 100 * (1 - raidFreeSize{raidName=~"Volume .*"} / raidTotalSize{raidName=~"Volume .*"})
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 90
    noDataState: OK
    execErrState: Error
    for: 30m
    labels:
      severity: warning
    annotations:
      summary: '{{ $labels.host }} {{ $labels.raidName }} is {{ printf "%.1f" $values.A.Value }}% full.'
    isPaused: false
  - uid: argus-cert-expiring
    title: Certificate expiring
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: min by (instance, service) ((probe_ssl_last_chain_expiry_timestamp_seconds{job="blackbox_http"} - time()) /
          86400)
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 14
    noDataState: OK
    execErrState: Error
    for: 1h
    labels:
      severity: warning
    annotations:
      summary: The certificate for {{ $labels.service }} expires in {{ humanize $values.A.Value }} days.
    isPaused: false
  - uid: argus-pve-memory-high
    title: Proxmox node memory almost full
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: 100 * max by (node) (label_replace(pve_memory_usage_bytes{id=~"node/.+"} / pve_memory_size_bytes{id=~"node/.+"},
          "node", "$1", "id", "node/(.+)"))
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 90
    noDataState: OK
    execErrState: Error
    for: 15m
    labels:
      severity: warning
    annotations:
      summary: Proxmox node {{ $labels.node }} is using {{ printf "%.1f" $values.A.Value }}% of its memory — move a guest
        to another node or shrink one.
    isPaused: false
  - uid: argus-pve-memory-overcommitted
    title: Proxmox node memory overcommitted
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: 100 * sum by (node) (pve_memory_size_bytes * on (instance, id) pve_up{id=~"(qemu|lxc)/.+"} * on (instance,
          id) group_left (node) pve_guest_info{template!="1"}) / on (node) max by (node) (label_replace(pve_memory_size_bytes{id=~"node/.+"},
          "node", "$1", "id", "node/(.+)"))
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 100
    noDataState: OK
    execErrState: Error
    for: 30m
    labels:
      severity: warning
    annotations:
      summary: The guests running on Proxmox node {{ $labels.node }} are allocated {{ printf "%.0f" $values.A.Value }}% of
        its memory — if they all use it, the node runs out.
    isPaused: false
- orgId: 1
  name: Power and hardware
  folder: Argus
  interval: 1m
  rules:
  - uid: argus-ups-on-battery
    title: UPS on battery
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max by (ups) (ups_input_voltage < bool 90)
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: The UPS is running on battery — mains power is out.
    isPaused: false
  - uid: argus-ups-battery-low
    title: UPS battery low
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: ups_battery_charge
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 50
    noDataState: OK
    execErrState: Error
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: UPS battery is at {{ printf "%.1f" $values.A.Value }}%.
    isPaused: false
  - uid: argus-nas-disk-unhealthy
    title: NAS disk unhealthy
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max by (host, diskID) (diskHealthStatus) > 1 or max by (host, diskID) (diskStatus) > 1
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 1
    noDataState: OK
    execErrState: Error
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: A disk in {{ $labels.host }} reports a problem (health/status code {{ humanize $values.A.Value }}).
    isPaused: false
  # Only Degraded (11) and Crashed (12). Synology's codes above 12 are routine work (13 = data
  # scrubbing, cache mount/unmount, conversions) or 21 = unknown; those read 0, so they never page.
  - uid: argus-nas-pool-degraded
    title: NAS storage pool degraded
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max by (host, raidName) ((raidStatus == 11 or raidStatus == 12) or raidStatus * 0)
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 10
    noDataState: OK
    execErrState: Error
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: '{{ $labels.host }} {{ $labels.raidName }} is degraded or crashed (status {{ humanize $values.A.Value }}).'
    isPaused: false
  - uid: argus-nas-disk-hot
    title: NAS disk hot
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max by (host, diskID) (diskTemperature)
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 55
    noDataState: OK
    execErrState: Error
    for: 15m
    labels:
      severity: warning
    annotations:
      summary: A disk in {{ $labels.host }} is at {{ humanize $values.A.Value }} °C.
    isPaused: false
  - uid: argus-unifi-hot
    title: Network device hot
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max by (name) (unpoller_device_temperature_celsius)
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 85
    noDataState: OK
    execErrState: Error
    for: 15m
    labels:
      severity: warning
    annotations:
      summary: '{{ $labels.name }} is at {{ humanize $values.A.Value }} °C.'
    isPaused: false
  # Consumer and workstation GPUs slow themselves down in the high 80s to 90s °C. NVIDIA GPUs come from the
  # gpu job (nvidia-smi); Intel discrete GPUs (i915 or xe driver) from node_exporter's hwmon collector, whichever
  # host's driver has the card: the server it's fitted in (job hwmon) or a VM it's passed through to (the agent,
  # job node). Their name is the card's PCI address, from node_exporter's chip label (…_0000:43:00_0).
  - uid: argus-gpu-hot
    title: GPU hot
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max by (host, uuid, name) (nvidia_smi_temperature_gpu{job="gpu"} * on (host, uuid) group_left (name)
          nvidia_smi_gpu_info{job="gpu"}) or max by (host, chip, name) (label_replace(node_hwmon_temp_celsius
          * on (job, host, chip) group_left (chip_name) node_hwmon_chip_names{chip_name=~"i915|xe"},
          "name", "Intel GPU $1.$2", "chip", ".*([0-9a-f]{4}:[0-9a-f]{2}:[0-9a-f]{2})_([0-9a-f])"))
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 85
    noDataState: OK
    execErrState: Error
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: '{{ $labels.host }} {{ $labels.name }} is at {{ with $values.A }}{{ humanize .Value }}{{ end }} °C.'
    isPaused: false
  # BMC sensor states (prometheus-ipmi-exporter): 0 nominal, 1 warning, 2 critical, NaN not available.
  # Not counted: Entity Presence sensors (2 = an empty slot or a part that isn't fitted, such as an
  # unused PSU bay or a dedicated BMC NIC on a board that shares one) and Supermicro's PatternN LED
  # sensors, which sit at 2 permanently. tests/test_configs.py keeps the dashboard on the same selector.
  - uid: argus-ipmi-sensor-critical
    title: Hardware sensor critical
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: 'max by (host, name, id, type) ({__name__=~"ipmi_(sensor|temperature|fan_speed|voltage|current|power)_state", job="ipmi", type!="Entity Presence", name!~"Pattern[0-9]+"})'
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 1
    noDataState: OK
    execErrState: Error
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: '{{ $labels.host }}: the BMC reports {{ $labels.name }}{{ if $labels.type }} ({{ $labels.type }}){{ end }} as critical: a failed battery, power supply or fan, or a reading past its critical limit.'
    isPaused: false
  - uid: argus-ipmi-sensor-warning
    title: Hardware sensor warning
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: 'max by (host, name, id, type) ({__name__=~"ipmi_(sensor|temperature|fan_speed|voltage|current|power)_state", job="ipmi", type!="Entity Presence", name!~"Pattern[0-9]+"} == 1)'
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 15m
    labels:
      severity: warning
    annotations:
      summary: '{{ $labels.host }}: the BMC reports {{ $labels.name }}{{ if $labels.type }} ({{ $labels.type }}){{ end }} as a warning: a reading past its warning limit, or redundancy reduced.'
    isPaused: false
  - uid: argus-ipmi-bmc-unreadable
    title: BMC not answering
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: min by (host, collector) (ipmi_up{job="ipmi"})
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
    noDataState: OK
    execErrState: Error
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: '{{ $labels.host }}: the IPMI exporter can''t read the BMC ({{ $labels.collector }} collector), so that server''s hardware sensors aren''t being checked.'
    isPaused: false
  - uid: argus-ipmi-sel-full
    title: BMC event log full
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: min by (host) (ipmi_sel_free_space_bytes{job="ipmi"})
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1024
    noDataState: OK
    execErrState: Error
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: '{{ $labels.host }}: {{ with $values.A }}{{ humanize1024 .Value }}{{ end }}B left in the BMC''s event log. Once it''s full, the BMC records no new hardware events: save the log, then clear it.'
    isPaused: false
- orgId: 1
  name: Network
  folder: Argus
  interval: 1m
  rules:
  - uid: argus-wan-failover
    title: Internet on backup WAN
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max by (wan_interface) (unpoller_wan_interface_state{wan_interface!="Internet 1"})
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: Traffic is going out over {{ $labels.wan_interface }} — the primary internet connection is down.
    isPaused: false
  - uid: argus-internet-drops
    title: Internet dropped
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max(increase(unpoller_site_intenet_drops_total{subsystem="www"}[15m]))
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 0s
    labels:
      severity: warning
    annotations:
      summary: The gateway lost internet connectivity {{ humanize $values.A.Value }} time(s) in the last 15 minutes.
    isPaused: false
  # The latest speed test (download or upload) is under half that direction's 14-day median. Compared with
  # the line's own history, not the plan speed in UniFi: the gateway's test can't measure a multi-gigabit
  # plan, so results sit well below it every day.
  - uid: argus-internet-slow
    title: Internet much slower than usual
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: label_replace(max(unpoller_speedtest_download_mbps{wan_group="WAN"}) / quantile_over_time(0.5, max(unpoller_speedtest_download_mbps{wan_group="WAN"})[14d:1h]),
          "direction", "download", "", "") or label_replace(max(unpoller_speedtest_upload_mbps{wan_group="WAN"}) / quantile_over_time(0.5,
          max(unpoller_speedtest_upload_mbps{wan_group="WAN"})[14d:1h]), "direction", "upload", "", "")
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 0.5
    noDataState: OK
    execErrState: Error
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: The gateway's latest {{ $labels.direction }} speed test came in at {{ humanizePercentage $values.A.Value }} of its usual
        (14-day median) result.
    isPaused: false
  - uid: argus-speedtest-stale
    title: No internet speed test in 8 days
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: time() - max(unpoller_device_speedtest_rundate_seconds)
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 691200
    noDataState: OK
    execErrState: Error
    for: 1h
    labels:
      severity: warning
    annotations:
      summary: The gateway hasn't run a speed test for {{ humanizeDuration $values.A.Value }}; check the speed test schedule in UniFi
        Network.
    isPaused: false
  - uid: argus-pihole-sync
    title: Pi-hole blocklists out of sync
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: count(count_values("domains", pihole_domains_being_blocked))
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 1
    noDataState: OK
    execErrState: Error
    for: 2h
    labels:
      severity: warning
    annotations:
      summary: The Pi-holes are blocking different numbers of domains — their blocklists have drifted apart.
    isPaused: false
- orgId: 1
  name: Logs
  folder: Argus
  interval: 5m
  rules:
  - uid: argus-proxy-5xx
    title: Site returning server errors
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: loki
      model:
        refId: A
        expr: sum by (site) (count_over_time({job="npm", status=~"5.."}[10m]))
        queryType: instant
        intervalMs: 60000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 20
    noDataState: OK
    execErrState: Error
    for: 0s
    labels:
      severity: warning
    annotations:
      summary: '{{ $labels.site }} returned {{ humanize $values.A.Value }} server errors (5xx) through the reverse proxy in
        the last 10 minutes.'
    isPaused: false
  - uid: argus-log-pipeline-stalled
    title: Log pipeline stalled
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: sum(rate(loki_distributor_lines_received_total[15m]))
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 0.01
    noDataState: OK
    execErrState: Error
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Loki has received almost no log lines for 15 minutes — Alloy agents or Loki itself have stopped.
    isPaused: false
- orgId: 1
  name: Containers
  folder: Argus
  interval: 5m
  rules:
  - uid: argus-container-restarting
    title: Container restarting repeatedly
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 3600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max by (host, name) (changes(container_start_time_seconds{job="cadvisor"}[1h]))
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 3
    noDataState: OK
    execErrState: Error
    for: 0s
    labels:
      severity: warning
    annotations:
      summary: '{{ $labels.host }} / {{ $labels.name }} restarted {{ humanize $values.A.Value }} times in the last hour.'
    isPaused: false
- orgId: 1
  name: GitLab
  folder: Argus
  interval: 1m
  rules:
  - uid: argus-gitlab-component-down
    title: GitLab component down
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max by (component) (gitlab_component_up{job="gitlab_server"})
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
    noDataState: OK
    execErrState: Error
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: GitLab's {{ $labels.component }} is down (as seen by GitLab's own Prometheus).
    isPaused: false
  # The latest pipeline on a watched branch failed. Only branches: a tag never gets a newer pipeline,
  # so a failed tag would alert forever. Passing branches report 0, so the alert resolves on the next
  # green run. The ID filter keeps only the newest label set (the exporter never drops old ones).
  - uid: argus-gitlab-pipeline-failing
    title: GitLab pipeline failing
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max by (project, ref) ((gitlab_ci_pipeline_status{kind="branch", status="failed"} == 1 and ignoring (status)
          (gitlab_ci_pipeline_id == on (project, kind, ref) group_left max by (project, kind, ref) (gitlab_ci_pipeline_id)))
          or (gitlab_ci_pipeline_id{kind="branch"} == on (project, kind, ref) group_left max by (project, kind, ref) (gitlab_ci_pipeline_id))
          * 0)
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: The latest pipeline on {{ $labels.project }} ({{ $labels.ref }}) failed.
    isPaused: false
- orgId: 1
  name: Tdarr
  folder: Argus
  interval: 5m
  rules:
  # Files whose transcode or health check failed in the last hour, per library. Tdarr keeps a failed
  # file in its error list until it's requeued or cleared, so the alert compares with an hour ago: it
  # fires once for new errors and resolves an hour later, while old ones stay on the dashboard.
  - uid: argus-tdarr-errors
    title: Tdarr reported new errors
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 3600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max by (library_name, check) ((label_replace(tdarr_library_transcodes{status="error"}
          - tdarr_library_transcodes{status="error"} offset 1h, "check", "transcode", "", "")
          or label_replace(tdarr_library_health_checks{status="error"}
          - tdarr_library_health_checks{status="error"} offset 1h, "check", "health check", "", ""))
          * on (tdarr_instance, library_id) group_left (library_name) tdarr_library_info)
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 0s
    labels:
      severity: warning
    annotations:
      summary: 'Tdarr: {{ with $values.A }}{{ humanize .Value }}{{ end }} new {{ $labels.check }} error(s) in {{ $labels.library_name }} in the last hour.'
    isPaused: false
  # Files are queued but nothing finished in a day: a node paused, never inside its schedule, or stuck.
  # A day, so a node whose schedule allows only some hours still finishes something; and only once
  # the exporter has a day of history, so a fresh install doesn't alert before it could know.
  - uid: argus-tdarr-stalled
    title: Tdarr queue not moving
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 86400
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: (sum by (tdarr_instance) (tdarr_library_transcodes{status="queued"})
          + sum by (tdarr_instance) (tdarr_library_health_checks{status="queued"}))
          unless on (tdarr_instance) (sum by (tdarr_instance) (increase(tdarr_library_transcodes_completed_total[1d]))
          + sum by (tdarr_instance) (increase(tdarr_library_health_checks_completed_total[1d])) > 0)
          and on (tdarr_instance) (tdarr_up offset 23h)
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 30m
    labels:
      severity: warning
    annotations:
      summary: 'Tdarr: {{ with $values.A }}{{ humanize .Value }}{{ end }} file(s) queued, but no transcode or health check finished in a day (node paused, outside its schedule, or stuck).'
    isPaused: false
- orgId: 1
  name: Tautulli
  folder: Argus
  interval: 1m
  rules:
  # Varken's last read of a Tautulli job failed (a request failed or Varken logged an error): Tautulli
  # is down, its API key is wrong, or its reply can't be read. 10 minutes, so a Tautulli restart
  # doesn't page. Varken itself going silent is "Monitoring target down" (job varken).
  - uid: argus-tautulli-unreachable
    title: Tautulli unreachable
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max by (server, job) (varken_job_up{service="tautulli"})
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
    noDataState: OK
    execErrState: Error
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: 'Varken can not read Tautulli (server {{ $labels.server }}, {{ $labels.job }}): Tautulli is down, its API key is wrong, or its reply is unreadable.'
    isPaused: false
  # Varken still reports Tautulli's activity job as up, but no read has finished for 10 minutes:
  # its last run never ended (Varken's requests have no timeout yet, so a hung Tautulli holds them).
  # Only while the job is up, so this and "Tautulli unreachable" never fire together.
  - uid: argus-tautulli-stale
    title: Tautulli data stale
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max by (server) (time() - varken_job_last_success_timestamp_seconds{service="tautulli",
          job="activity"}) and on (server) (max by (server) (varken_job_up{service="tautulli", job="activity"})
          == 1)
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 600
    noDataState: OK
    execErrState: Error
    for: 0s
    labels:
      severity: warning
    annotations:
      summary: 'Varken has not finished reading Tautulli (server {{ $labels.server }}) for {{ with $values.A }}{{ humanizeDuration .Value }}{{ end }}: a request to Tautulli is hanging.'
    isPaused: false
- orgId: 1
  name: Deploys
  folder: Argus
  interval: 1m
  rules:
  # homelab-pull (a pull-based deploy agent) rewrites its metrics file when a run ends, every ~90 s;
  # one run may take up to 45 minutes (a deploy with big image pulls), so 50 minutes without a run
  # means the timer stopped or the install broke. A host that's down is "Host stopped reporting".
  - uid: argus-deploy-agent-silent
    title: Deploy agent silent
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max by (host, stack) (time() - homelab_pull_last_run_timestamp_seconds{job="node"})
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 3000
    noDataState: OK
    execErrState: Error
    for: 0s
    labels:
      severity: warning
    annotations:
      summary: 'homelab-pull for {{ $labels.stack }} on {{ $labels.host }} last ran {{ with $values.A }}{{ humanizeDuration .Value }}{{ end }} ago: its timer stopped or the install broke.'
    isPaused: false
  # A deploy attempt failed and no later one succeeded, for 15 minutes (the agent retries a failed
  # commit every 15 minutes). Every stack keeps a series (0), so the summary always has a value.
  - uid: argus-deploy-failing
    title: Deploy failing
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max by (host, stack, commit, kind) (homelab_pull_deploy_failure_info{job="node"})
          or on (host, stack) max by (host, stack) (homelab_pull_deploy_failing{job="node"}) * 0
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 15m
    labels:
      severity: warning
    annotations:
      summary: Deploying {{ $labels.stack }} on {{ $labels.host }} fails at {{ $labels.kind }} (commit {{ $labels.commit }}); what runs is the last deployed commit.
    isPaused: false
  # Every run in 15 minutes ended in an error without a failed deploy to show for it: the fetch from
  # GitHub fails, or the settings are broken. (While a deploy is failing, the runs that wait out its
  # retry delay succeed, so this doesn't fire alongside "Deploy failing".)
  - uid: argus-deploy-agent-erroring
    title: Deploy agent erroring
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max by (host, stack) (max_over_time(homelab_pull_last_run_success{job="node"}[15m]))
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
    noDataState: OK
    execErrState: Error
    for: 0s
    labels:
      severity: warning
    annotations:
      summary: Every homelab-pull run for {{ $labels.stack }} on {{ $labels.host }} failed for 15 minutes (fetching from GitHub, or its settings); see its journal.
    isPaused: false
  # The checkout isn't on its branch (pinned by hand to a tag or another branch), so merges don't
  # reach the host.
  - uid: argus-deploy-paused
    title: Deploys paused
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max by (host, stack) (homelab_pull_paused{job="node"})
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 2h
    labels:
      severity: warning
    annotations:
      summary: Deploys of {{ $labels.stack }} on {{ $labels.host }} have been paused for 2 hours (its checkout isn't on its branch), so merges don't reach it.
    isPaused: false
