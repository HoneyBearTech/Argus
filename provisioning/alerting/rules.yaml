# Grafana-managed alert rules, provisioned from this file (edit here, not in the UI).
# Each rule: A = the raw PromQL measurement, C = the threshold on A; one alert per series.
apiVersion: 1
groups:
- orgId: 1
  name: Availability
  folder: Argus
  interval: 1m
  rules:
  - uid: argus-host-down
    title: Host stopped reporting
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max by (host) (up{job="node"}) or max by (host) (max_over_time(up{job="node"}[1d])) * 0
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
    noDataState: OK
    execErrState: Error
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: '{{ $labels.host }} reported in the last day but its Argus agent has gone silent (agent stopped or the host
        is down).'
    isPaused: false
  - uid: argus-service-down
    title: Service down
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max_over_time(probe_success{job="blackbox_http"}[5m]) and on (instance) (sum_over_time(probe_success{job="blackbox_http"}[7d])
          > 60)
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
    noDataState: OK
    execErrState: Error
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: '{{ $labels.service }} ({{ $labels.group }}) has failed every probe for 5 minutes.'
    isPaused: false
  - uid: argus-dns-down
    title: DNS server not answering
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: probe_success{job="blackbox_dns"}
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
    noDataState: OK
    execErrState: Error
    for: 3m
    labels:
      severity: critical
    annotations:
      summary: '{{ $labels.service }} isn''t resolving names.'
    isPaused: false
  - uid: argus-exporter-down
    title: Monitoring target down
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: up{job!="node"}
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
    noDataState: OK
    execErrState: Error
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: Prometheus can't scrape {{ $labels.job }} at {{ $labels.instance }} — the dashboards relying on it are missing
        data.
    isPaused: false
  - uid: argus-pve-quorum-lost
    title: Proxmox cluster without quorum
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: min by (instance) (pve_up{job="pve_quorum", id=~"cluster/.+"})
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
    noDataState: OK
    execErrState: Error
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: The Proxmox node at {{ $labels.instance }} has no cluster quorum — guests on it can't be started, migrated
        or changed until enough nodes (or the QDevice) are back.
    isPaused: false
  - uid: argus-pve-qdevice-down
    title: Proxmox QDevice disconnected
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: min by (instance) (pve_qdevice_up{job="pve_quorum"})
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
    noDataState: OK
    execErrState: Error
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: The Proxmox node at {{ $labels.instance }} has lost the cluster's QDevice — one more node going down would
        cost the cluster its quorum.
    isPaused: false
- orgId: 1
  name: Capacity
  folder: Argus
  interval: 5m
  rules:
  - uid: argus-disk-full
    title: Disk almost full
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: 100 * (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|nsfs|ramfs|fuse.*|vfat|nfs.*|cifs"} /
          node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|nsfs|ramfs|fuse.*|vfat|nfs.*|cifs"})
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 90
    noDataState: OK
    execErrState: Error
    for: 30m
    labels:
      severity: warning
    annotations:
      summary: '{{ $labels.host }} {{ $labels.mountpoint }} is {{ printf "%.1f" $values.A.Value }}% full.'
    isPaused: false
  - uid: argus-pool-full
    title: NAS storage pool almost full
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        # Volumes only: a storage pool's free space is what isn't allocated to a volume yet,
        # so a pool given entirely to its volumes reads 100 % full; SSD caches are always full.
        expr: 100 * (1 - raidFreeSize{raidName=~"Volume .*"} / raidTotalSize{raidName=~"Volume .*"})
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 90
    noDataState: OK
    execErrState: Error
    for: 30m
    labels:
      severity: warning
    annotations:
      summary: '{{ $labels.host }} {{ $labels.raidName }} is {{ printf "%.1f" $values.A.Value }}% full.'
    isPaused: false
  - uid: argus-cert-expiring
    title: Certificate expiring
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: min by (instance, service) ((probe_ssl_last_chain_expiry_timestamp_seconds{job="blackbox_http"} - time()) /
          86400)
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 14
    noDataState: OK
    execErrState: Error
    for: 1h
    labels:
      severity: warning
    annotations:
      summary: The certificate for {{ $labels.service }} expires in {{ humanize $values.A.Value }} days.
    isPaused: false
  - uid: argus-pve-memory-high
    title: Proxmox node memory almost full
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: 100 * max by (node) (label_replace(pve_memory_usage_bytes{id=~"node/.+"} / pve_memory_size_bytes{id=~"node/.+"},
          "node", "$1", "id", "node/(.+)"))
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 90
    noDataState: OK
    execErrState: Error
    for: 15m
    labels:
      severity: warning
    annotations:
      summary: Proxmox node {{ $labels.node }} is using {{ printf "%.1f" $values.A.Value }}% of its memory — move a guest
        to another node or shrink one.
    isPaused: false
  - uid: argus-pve-memory-overcommitted
    title: Proxmox node memory overcommitted
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: 100 * sum by (node) (pve_memory_size_bytes * on (instance, id) pve_up{id=~"(qemu|lxc)/.+"} * on (instance,
          id) group_left (node) pve_guest_info{template!="1"}) / on (node) max by (node) (label_replace(pve_memory_size_bytes{id=~"node/.+"},
          "node", "$1", "id", "node/(.+)"))
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 100
    noDataState: OK
    execErrState: Error
    for: 30m
    labels:
      severity: warning
    annotations:
      summary: The guests running on Proxmox node {{ $labels.node }} are allocated {{ printf "%.0f" $values.A.Value }}% of
        its memory — if they all use it, the node runs out.
    isPaused: false
- orgId: 1
  name: Power and hardware
  folder: Argus
  interval: 1m
  rules:
  - uid: argus-ups-on-battery
    title: UPS on battery
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max by (ups) (ups_input_voltage < bool 90)
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: The UPS is running on battery — mains power is out.
    isPaused: false
  - uid: argus-ups-battery-low
    title: UPS battery low
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: ups_battery_charge
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 50
    noDataState: OK
    execErrState: Error
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: UPS battery is at {{ printf "%.1f" $values.A.Value }}%.
    isPaused: false
  - uid: argus-nas-disk-unhealthy
    title: NAS disk unhealthy
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max by (host, diskID) (diskHealthStatus) > 1 or max by (host, diskID) (diskStatus) > 1
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 1
    noDataState: OK
    execErrState: Error
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: A disk in {{ $labels.host }} reports a problem (health/status code {{ humanize $values.A.Value }}).
    isPaused: false
  # Only Degraded (11) and Crashed (12). Synology's codes above 12 are routine work (13 = data
  # scrubbing, cache mount/unmount, conversions) or 21 = unknown; those read 0, so they never page.
  - uid: argus-nas-pool-degraded
    title: NAS storage pool degraded
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max by (host, raidName) ((raidStatus == 11 or raidStatus == 12) or raidStatus * 0)
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 10
    noDataState: OK
    execErrState: Error
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: '{{ $labels.host }} {{ $labels.raidName }} is degraded or crashed (status {{ humanize $values.A.Value }}).'
    isPaused: false
  - uid: argus-nas-disk-hot
    title: NAS disk hot
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max by (host, diskID) (diskTemperature)
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 55
    noDataState: OK
    execErrState: Error
    for: 15m
    labels:
      severity: warning
    annotations:
      summary: A disk in {{ $labels.host }} is at {{ humanize $values.A.Value }} °C.
    isPaused: false
  - uid: argus-unifi-hot
    title: Network device hot
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max by (name) (unpoller_device_temperature_celsius)
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 85
    noDataState: OK
    execErrState: Error
    for: 15m
    labels:
      severity: warning
    annotations:
      summary: '{{ $labels.name }} is at {{ humanize $values.A.Value }} °C.'
    isPaused: false
- orgId: 1
  name: Network
  folder: Argus
  interval: 1m
  rules:
  - uid: argus-wan-failover
    title: Internet on backup WAN
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max by (wan_interface) (unpoller_wan_interface_state{wan_interface!="Internet 1"})
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: Traffic is going out over {{ $labels.wan_interface }} — the primary internet connection is down.
    isPaused: false
  - uid: argus-internet-drops
    title: Internet dropped
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max(increase(unpoller_site_intenet_drops_total{subsystem="www"}[15m]))
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 0s
    labels:
      severity: warning
    annotations:
      summary: The gateway lost internet connectivity {{ humanize $values.A.Value }} time(s) in the last 15 minutes.
    isPaused: false
  # The latest speed test (download or upload) is under half that direction's 14-day median. Compared with
  # the line's own history, not the plan speed in UniFi: the gateway's test can't measure a multi-gigabit
  # plan, so results sit well below it every day.
  - uid: argus-internet-slow
    title: Internet much slower than usual
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: label_replace(max(unpoller_speedtest_download_mbps{wan_group="WAN"}) / quantile_over_time(0.5, max(unpoller_speedtest_download_mbps{wan_group="WAN"})[14d:1h]),
          "direction", "download", "", "") or label_replace(max(unpoller_speedtest_upload_mbps{wan_group="WAN"}) / quantile_over_time(0.5,
          max(unpoller_speedtest_upload_mbps{wan_group="WAN"})[14d:1h]), "direction", "upload", "", "")
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 0.5
    noDataState: OK
    execErrState: Error
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: The gateway's latest {{ $labels.direction }} speed test came in at {{ humanizePercentage $values.A.Value }} of its usual
        (14-day median) result.
    isPaused: false
  - uid: argus-speedtest-stale
    title: No internet speed test in 8 days
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: time() - max(unpoller_device_speedtest_rundate_seconds)
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 691200
    noDataState: OK
    execErrState: Error
    for: 1h
    labels:
      severity: warning
    annotations:
      summary: The gateway hasn't run a speed test for {{ humanizeDuration $values.A.Value }}; check the speed test schedule in UniFi
        Network.
    isPaused: false
  - uid: argus-pihole-sync
    title: Pi-hole blocklists out of sync
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: count(count_values("domains", pihole_domains_being_blocked))
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 1
    noDataState: OK
    execErrState: Error
    for: 2h
    labels:
      severity: warning
    annotations:
      summary: The Pi-holes are blocking different numbers of domains — their blocklists have drifted apart.
    isPaused: false
- orgId: 1
  name: Logs
  folder: Argus
  interval: 5m
  rules:
  - uid: argus-proxy-5xx
    title: Site returning server errors
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: loki
      model:
        refId: A
        expr: sum by (site) (count_over_time({job="npm", status=~"5.."}[10m]))
        queryType: instant
        intervalMs: 60000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 20
    noDataState: OK
    execErrState: Error
    for: 0s
    labels:
      severity: warning
    annotations:
      summary: '{{ $labels.site }} returned {{ humanize $values.A.Value }} server errors (5xx) through the reverse proxy in
        the last 10 minutes.'
    isPaused: false
  - uid: argus-log-pipeline-stalled
    title: Log pipeline stalled
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: sum(rate(loki_distributor_lines_received_total[15m]))
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 0.01
    noDataState: OK
    execErrState: Error
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: Loki has received almost no log lines for 15 minutes — Alloy agents or Loki itself have stopped.
    isPaused: false
- orgId: 1
  name: Containers
  folder: Argus
  interval: 5m
  rules:
  - uid: argus-container-restarting
    title: Container restarting repeatedly
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 3600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max by (host, name) (changes(container_start_time_seconds{job="cadvisor"}[1h]))
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 3
    noDataState: OK
    execErrState: Error
    for: 0s
    labels:
      severity: warning
    annotations:
      summary: '{{ $labels.host }} / {{ $labels.name }} restarted {{ humanize $values.A.Value }} times in the last hour.'
    isPaused: false
- orgId: 1
  name: GitLab
  folder: Argus
  interval: 1m
  rules:
  - uid: argus-gitlab-component-down
    title: GitLab component down
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max by (component) (gitlab_component_up{job="gitlab_server"})
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
    noDataState: OK
    execErrState: Error
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: GitLab's {{ $labels.component }} is down (as seen by GitLab's own Prometheus).
    isPaused: false
  # The latest pipeline on a watched branch failed. Only branches: a tag never gets a newer pipeline,
  # so a failed tag would alert forever. Passing branches report 0, so the alert resolves on the next
  # green run. The ID filter keeps only the newest label set (the exporter never drops old ones).
  - uid: argus-gitlab-pipeline-failing
    title: GitLab pipeline failing
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max by (project, ref) ((gitlab_ci_pipeline_status{kind="branch", status="failed"} == 1 and ignoring (status)
          (gitlab_ci_pipeline_id == on (project, kind, ref) group_left max by (project, kind, ref) (gitlab_ci_pipeline_id)))
          or (gitlab_ci_pipeline_id{kind="branch"} == on (project, kind, ref) group_left max by (project, kind, ref) (gitlab_ci_pipeline_id))
          * 0)
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: The latest pipeline on {{ $labels.project }} ({{ $labels.ref }}) failed.
    isPaused: false
- orgId: 1
  name: Tdarr
  folder: Argus
  interval: 5m
  rules:
  # Files whose transcode or health check failed in the last hour, per library. Tdarr keeps a failed
  # file in its error list until it's requeued or cleared, so the alert compares with an hour ago: it
  # fires once for new errors and resolves an hour later, while old ones stay on the dashboard.
  - uid: argus-tdarr-errors
    title: Tdarr reported new errors
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 3600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max by (library_name, check) ((label_replace(tdarr_library_transcodes{status="error"}
          - tdarr_library_transcodes{status="error"} offset 1h, "check", "transcode", "", "")
          or label_replace(tdarr_library_health_checks{status="error"}
          - tdarr_library_health_checks{status="error"} offset 1h, "check", "health check", "", ""))
          * on (tdarr_instance, library_id) group_left (library_name) tdarr_library_info)
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 0s
    labels:
      severity: warning
    annotations:
      summary: 'Tdarr: {{ with $values.A }}{{ humanize .Value }}{{ end }} new {{ $labels.check }} error(s) in {{ $labels.library_name }} in the last hour.'
    isPaused: false
  # Files are queued but nothing finished in a day: a node paused, never inside its schedule, or stuck.
  # A day, so a node whose schedule allows only some hours still finishes something; and only once
  # the exporter has a day of history, so a fresh install doesn't alert before it could know.
  - uid: argus-tdarr-stalled
    title: Tdarr queue not moving
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 86400
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: (sum by (tdarr_instance) (tdarr_library_transcodes{status="queued"})
          + sum by (tdarr_instance) (tdarr_library_health_checks{status="queued"}))
          unless on (tdarr_instance) (sum by (tdarr_instance) (increase(tdarr_library_transcodes_completed_total[1d]))
          + sum by (tdarr_instance) (increase(tdarr_library_health_checks_completed_total[1d])) > 0)
          and on (tdarr_instance) (tdarr_up offset 23h)
        instant: true
        range: false
        intervalMs: 15000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 30m
    labels:
      severity: warning
    annotations:
      summary: 'Tdarr: {{ with $values.A }}{{ humanize .Value }}{{ end }} file(s) queued, but no transcode or health check finished in a day (node paused, outside its schedule, or stuck).'
    isPaused: false
