# Where alerts go. The webhook URL is read from secrets/discord_webhook_url,
# mounted as a compose secret so it doesn't show in `docker inspect`. Its
# template (secrets.example/) points at an address that never resolves, so a
# sandbox can't post to the real channel.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: Discord
    receivers:
      - uid: argus-discord
        type: discord
        disableResolveMessage: false
        settings:
          url: $__file{/run/secrets/discord_webhook_url}
          use_discord_username: false
          title: '{{ template "default.title" . }}'
          message: '{{ template "default.message" . }}'
