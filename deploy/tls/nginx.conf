worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    resolver 127.0.0.11 valid=30s ipv6=off;
    upstream prometheus_push {
        zone prometheus_push 64k;
        server prometheus:9090 resolve;
    }
    upstream loki_push {
        zone loki_push 64k;
        server loki:3100 resolve;
    }
    access_log off;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server {
        listen 8443 ssl;
        server_name _;
        ssl_certificate /etc/nginx/push-tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/push-tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        auth_basic "Argus push";
        auth_basic_user_file /etc/nginx/push-tls/htpasswd;
        client_max_body_size 16m;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        location = /api/v1/write {
            limit_except POST { deny all; }
            proxy_pass http://prometheus_push;
        }
        location = /loki/api/v1/push {
            limit_except POST { deny all; }
            # The proxy authenticates Loki; no credentials reach the log store.
            proxy_set_header Authorization "";
            proxy_pass http://loki_push;
        }
        location / { return 404; }
    }
}
