# Authenticated TLS for the two push paths. Requires Compose 2.24.4+ (!override).
# Follow docs/push-security.md before enabling this overlay.
services:
  prometheus:
    ports: !override
      - 127.0.0.1:9090:9090
  loki:
    ports: !override
      - 127.0.0.1:3101:3100
  push-proxy:
    image: nginx:1.30.6-alpine@sha256:901e593c95dc85f5a729f5765516321366ef4ac401821431d408897e95287d0a
    restart: unless-stopped
    user: "101:101"
    entrypoint: [nginx]
    command: [-g, "daemon off;"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:uid=101,gid=101,mode=0700
    ports:
      - ${ARGUS_PUSH_BIND:-0.0.0.0:8443}:8443
    volumes:
      - type: bind
        source: ./deploy/tls/nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ./secrets/push-tls
        target: /etc/nginx/push-tls
        read_only: true
        bind: { create_host_path: false }
    depends_on: [prometheus, loki]
