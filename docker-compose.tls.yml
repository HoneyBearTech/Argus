# Authenticated TLS for the two push paths. Requires Compose 2.24.4+ (!override).
# Follow docs/push-security.md before enabling this overlay.
services:
  prometheus:
    ports: !override
      - 127.0.0.1:9090:9090
  loki:
    ports: !override
      - 127.0.0.1:3101:3100
  push-proxy:
    image: nginx:1.31.9-alpine@sha256:fb4658584bd9a916ffb6f6e365f97c25cfdb2923801f551ea08356e695f14ff7
    restart: unless-stopped
    user: "101:101"
    entrypoint: [nginx]
    command: [-g, "daemon off;"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:uid=101,gid=101,mode=0700
    ports:
      - ${ARGUS_PUSH_BIND:-0.0.0.0:8443}:8443
    volumes:
      - type: bind
        source: ./deploy/tls/nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ./secrets/push-tls
        target: /etc/nginx/push-tls
        read_only: true
        bind: { create_host_path: false }
    depends_on: [prometheus, loki]
