global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Each job reads its targets from targets/<job>.json on the host (file_sd), so
# no addresses are committed. Prometheus picks up changes to those files
# without a restart. Placeholder versions live in targets.example/.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  # UPS metrics from PeaNUT.
  - job_name: peanut
    metrics_path: /api/v1/metrics
    file_sd_configs:
      - files: [/etc/prometheus/targets/peanut.json]

  # Host metrics from node_exporter (agents/node-exporter/). Targets carry a
  # `host` label naming the machine.
  - job_name: node
    file_sd_configs:
      - files: [/etc/prometheus/targets/node.json]

  # Monitor status and response times from Uptime Kuma. Kuma takes its API
  # key as the basic-auth password; the username is ignored.
  - job_name: uptime_kuma
    basic_auth:
      username: argus
      password_file: /etc/prometheus/secrets/uptime_kuma_api_key
    file_sd_configs:
      - files: [/etc/prometheus/targets/uptime_kuma.json]

  # Web services probed through blackbox_exporter. Each target is a URL with
  # `service` and `group` labels; the probe itself runs on the exporter.
  - job_name: blackbox_http
    metrics_path: /probe
    params:
      module: [http_service]
    file_sd_configs:
      - files: [/etc/prometheus/targets/blackbox_http.json]
    relabel_configs: &blackbox_relabel
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # DNS servers, each asked to resolve a well-known name.
  - job_name: blackbox_dns
    metrics_path: /probe
    params:
      module: [dns_resolve]
    file_sd_configs:
      - files: [/etc/prometheus/targets/blackbox_dns.json]
    relabel_configs: *blackbox_relabel
