global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Host and container metrics are pushed by Argus agents (agent/) through the
# remote-write receiver. Every job below reads its targets from
# targets/<job>.json on the host (file_sd), so no addresses are committed. Prometheus picks up changes to those files
# without a restart. Placeholder versions live in targets.example/.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  # UPS metrics from PeaNUT.
  - job_name: peanut
    metrics_path: /api/v1/metrics
    file_sd_configs:
      - files: [/etc/prometheus/targets/peanut.json]

  # SNMP devices via snmp-exporter (only runs with the `snmp` compose
  # profile). Targets carry `host` and `module` labels; `module` picks the
  # snmp-exporter modules to walk and `auth` the credentials in
  # secrets/snmp-auth.yml.
  - job_name: snmp
    scrape_interval: 60s
    scrape_timeout: 50s
    metrics_path: /snmp
    file_sd_configs:
      - files: [/etc/prometheus/targets/snmp.json]
    relabel_configs:
      - source_labels: [module]
        target_label: __param_module
      - source_labels: [auth]
        target_label: __param_auth
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: snmp-exporter:9116
      - regex: module|auth
        action: labeldrop

  # Home Assistant's Prometheus integration. Authenticates with a long-lived
  # access token from secrets/home_assistant_token. HA exports every entity
  # (~17k series); only the families the Smart Home dashboard and alerts use
  # are kept.
  - job_name: homeassistant
    scrape_interval: 60s
    scrape_timeout: 30s
    metrics_path: /api/prometheus
    authorization:
      credentials_file: /etc/prometheus/secrets/home_assistant_token
    file_sd_configs:
      - files: [/etc/prometheus/targets/homeassistant.json]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: homeassistant_(climate_.+|sensor_temperature_celsius|sensor_humidity_percent|sensor_power_w|sensor_energy_kwh|sensor_battery_percent|person_state|lock_state|update_state|automation_triggered_count_total|entity_available|entity_info|area_info)
        action: keep

  # Media apps: exportarr (*arr, SABnzbd) and qbittorrent-exporter.
  # targets/media.json lists only the exporters enabled on this host, each
  # with an `app` label. The *arr APIs are slow on big libraries, hence the
  # long interval.
  - job_name: media
    scrape_interval: 2m
    scrape_timeout: 90s
    file_sd_configs:
      - files: [/etc/prometheus/targets/media.json]
    metric_relabel_configs:
      # qbittorrent-exporter emits ~17 series per torrent (11k+ here); keep only
      # the client-wide totals.
      - source_labels: [__name__]
        regex: qbittorrent_torrent_.+
        action: drop

  # Plex sessions, bandwidth and libraries from the Plex exporter that runs
  # beside each Plex server (agent/compose.yml, `plex` profile). Its own job
  # and a short interval so "now playing" stays current.
  - job_name: plex
    scrape_interval: 30s
    file_sd_configs:
      - files: [/etc/prometheus/targets/plex.json]

  # GitLab CI pipelines and jobs via gitlab-ci-pipelines-exporter (only runs
  # with the `gitlab` compose profile, so targets/gitlab.json lists it only
  # where it's enabled). It polls GitLab's API every 30 s.
  - job_name: gitlab
    scrape_interval: 30s
    file_sd_configs:
      - files: [/etc/prometheus/targets/gitlab.json]

  # GitLab Runner's own metrics (`listen_address` in the runner's
  # config.toml): jobs running against its concurrency limit, errors.
  - job_name: gitlab_runner
    scrape_interval: 30s
    file_sd_configs:
      - files: [/etc/prometheus/targets/gitlab_runner.json]

  # GitLab's health (Omnibus): a subset of what GitLab's bundled Prometheus
  # already scrapes from its components, read through /federate
  # (`prometheus['listen_address']` in gitlab.rb). The component a series
  # comes from becomes `component`; its `up` becomes gitlab_component_up so
  # it isn't mistaken for an Argus scrape target.
  - job_name: gitlab_server
    scrape_interval: 30s
    scrape_timeout: 25s
    metrics_path: /federate
    params:
      match[]:
        - up
        - '{__name__=~"puma_.*"}'
        - '{__name__=~"sidekiq_(queue_size|queue_latency_seconds|jobs_failed_total|concurrency)"}'
        - '{__name__=~"gitlab_workhorse_http_requests_total|gitlab_workhorse_http_request_duration_seconds_(bucket|count|sum)"}'
        - '{__name__=~"pg_up|redis_up|ruby_process_resident_memory_bytes"}'
    file_sd_configs:
      - files: [/etc/prometheus/targets/gitlab_server.json]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: up
        target_label: __name__
        replacement: gitlab_component_up
      - source_labels: [exported_job]
        target_label: component
      - regex: exported_job|exported_instance
        action: labeldrop

  # Loki's own metrics (ingestion, storage), so a stalled log pipeline shows
  # up as a down target like any other exporter.
  - job_name: loki
    scrape_interval: 60s
    file_sd_configs:
      - files: [/etc/prometheus/targets/loki.json]

  # Pi-hole query stats via pihole-exporter (one exporter, every Pi-hole;
  # each series carries the Pi-hole's address in its `hostname` label).
  - job_name: pihole
    static_configs:
      - targets: [pihole-exporter:9617]

  # UniFi gateway, switch, AP and client stats via unpoller.
  - job_name: unifi
    scrape_interval: 30s
    scrape_timeout: 25s
    static_configs:
      - targets: [unpoller:9130]

  # Monitor status and response times from Uptime Kuma. Kuma takes its API
  # key as the basic-auth password; the username is ignored.
  - job_name: uptime_kuma
    basic_auth:
      username: argus
      password_file: /etc/prometheus/secrets/uptime_kuma_api_key
    file_sd_configs:
      - files: [/etc/prometheus/targets/uptime_kuma.json]

  # Web services probed through blackbox_exporter. Each target is a URL with
  # `service` and `group` labels; the probe itself runs on the exporter.
  - job_name: blackbox_http
    metrics_path: /probe
    params:
      module: [http_service]
    file_sd_configs:
      - files: [/etc/prometheus/targets/blackbox_http.json]
    relabel_configs: &blackbox_relabel
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # DNS servers, each asked to resolve a well-known name.
  - job_name: blackbox_dns
    metrics_path: /probe
    params:
      module: [dns_resolve]
    file_sd_configs:
      - files: [/etc/prometheus/targets/blackbox_dns.json]
    relabel_configs: *blackbox_relabel
