# node_exporter for one Docker host. Copy this file to the host (e.g.
# ~/argus-agent/compose.yml) and run `docker compose up -d` there; Prometheus
# then scrapes the host on port 9100. Host networking and the read-only root
# mount let it report the host's own CPU, memory, disks and network rather
# than the container's.
name: argus-agent

services:
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: argus-node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
