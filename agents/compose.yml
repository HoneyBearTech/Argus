# Argus agents for one monitored Docker host. Copy this directory to the host
# (e.g. ~/argus-agent/) and run `docker compose up -d` there.
# Prometheus scrapes node-exporter on :9100 and cAdvisor on :9338 (and, on a
# Plex host with the `plex` profile enabled, the Plex exporter on :9594).
name: argus-agent

services:
  # Host CPU, memory, disks and network. Host networking and the read-only
  # root mount make it report the host itself rather than the container.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: argus-node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave

  # Per-container CPU, memory, network and restarts. Docker containers only,
  # with the expensive metric groups and container labels turned off to keep
  # the series count small.
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    container_name: argus-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    ports:
      - 9338:8080
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --disable_metrics=advtcp,cpu_topology,cpuset,hugetlb,memory_numa,percpu,perf_event,process,referenced_memory,resctrl,sched,tcp,udp
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

  # Plex playback, transcode, library and host metrics. Only on a Plex host:
  # set COMPOSE_PROFILES=plex, PLEX_SERVER and PLEX_TOKEN in this directory's
  # .env. The image is amd64-only, which is why it runs here rather than in the
  # main stack.
  plex-exporter:
    image: ghcr.io/jsclayton/prometheus-plex-exporter@sha256:18ef1b2197efbcb75bd7276380955760995f10a9fbe55106809a6fcff91c2940
    container_name: argus-plex-exporter
    restart: unless-stopped
    profiles: [plex]
    environment:
      PLEX_SERVER: ${PLEX_SERVER:-http://localhost:32400}
      PLEX_TOKEN: ${PLEX_TOKEN:-}
    ports:
      - 9594:9000

  # Log shipping to Loki (logs/compose.yml): this host's Docker container logs,
  # plus Nginx Proxy Manager access logs where NPM_LOG_DIR is set. Enable with
  # the `logs` profile; needs LOKI_URL and ARGUS_HOST in this directory's .env.
  alloy:
    image: grafana/alloy:v1.20.1
    container_name: argus-alloy
    restart: unless-stopped
    profiles: [logs]
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      LOKI_URL: ${LOKI_URL:-http://loki.invalid:3100}
      ARGUS_HOST: ${ARGUS_HOST:-unknown}
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${NPM_LOG_DIR:-./no-npm-logs}:/var/log/npm:ro
      - alloy_data:/var/lib/alloy/data

volumes:
  alloy_data:
